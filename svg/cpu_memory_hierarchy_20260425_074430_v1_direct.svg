<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- CPU Core -->
  <g id="cpu_core">
    <rect x="400" y="50" width="400" height="80" fill="#e0f7fa" stroke="#000" stroke-width="2"/>
    <text x="600" y="100" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">CPU Core</text>
  </g>

  <!-- Registers -->
  <g id="registers">
    <rect x="400" y="150" width="400" height="80" fill="#b2ebf2" stroke="#000" stroke-width="2"/>
    <text x="600" y="190" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect x="400" y="250" width="400" height="80" fill="#80deea" stroke="#000" stroke-width="2"/>
    <text x="600" y="290" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">L1 Cache</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect x="400" y="350" width="400" height="80" fill="#4dd0e1" stroke="#000" stroke-width="2"/>
    <text x="600" y="390" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">L2 Cache</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect x="400" y="450" width="400" height="80" fill="#26c6da" stroke="#000" stroke-width="2"/>
    <text x="600" y="490" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">L3 Cache</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect x="400" y="550" width="400" height="80" fill="#00bcd4" stroke="#000" stroke-width="2"/>
    <text x="600" y="590" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect x="400" y="650" width="400" height="80" fill="#0097a7" stroke="#000" stroke-width="2"/>
    <text x="600" y="690" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="middle">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="130" x2="600" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="230" x2="600" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="330" x2="600" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="430" x2="600" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="530" x2="600" y2="550" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="630" x2="600" y2="650" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>