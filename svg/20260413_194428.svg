<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700">
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Sun heating -->
  <g id="sun_heating">
    <rect x="100" y="50" width="200" height="80" fill="#FFEB3B" stroke="black"/>
    <text x="200" y="95" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Sun Heating</text>
  </g>

  <!-- Evaporation -->
  <g id="evaporation">
    <rect x="100" y="170" width="200" height="80" fill="#90CAF9" stroke="black"/>
    <text x="200" y="215" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Evaporation</text>
  </g>

  <!-- Rising air -->
  <g id="rising_air">
    <rect x="100" y="290" width="200" height="80" fill="#A5D6A7" stroke="black"/>
    <text x="200" y="335" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Rising Air</text>
  </g>

  <!-- Cooling -->
  <g id="cooling">
    <rect x="100" y="410" width="200" height="80" fill="#CE93D8" stroke="black"/>
    <text x="200" y="455" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Cooling</text>
  </g>

  <!-- Condensation -->
  <g id="condensation">
    <rect x="100" y="530" width="200" height="80" fill="#FFF59D" stroke="black"/>
    <text x="200" y="575" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Condensation</text>
  </g>

  <!-- Cloud droplets -->
  <g id="cloud_droplets">
    <rect x="400" y="290" width="200" height="80" fill="#B3E5FC" stroke="black"/>
    <text x="500" y="335" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Cloud Droplets</text>
  </g>

  <!-- Precipitation -->
  <g id="precipitation">
    <rect x="400" y="530" width="200" height="80" fill="#90A4AE" stroke="black"/>
    <text x="500" y="575" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Precipitation</text>
  </g>

  <!-- Arrows showing flow -->
  <!-- Sun -> Evaporation -->
  <line x1="200" y1="130" x2="200" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Evaporation -> Rising Air -->
  <line x1="200" y1="250" x2="200" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rising Air -> Cooling -->
  <line x1="200" y1="370" x2="200" y2="410" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Cooling -> Condensation -->
  <line x1="200" y1="490" x2="200" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Rising Air -> Cloud Droplets (side flow) -->
  <line x1="300" y1="330" x2="400" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Condensation -> Precipitation (side flow) -->
  <line x1="300" y1="570" x2="400" y2="570" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
</svg>