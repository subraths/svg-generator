<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Water Cycle</text>

  <!-- Nodes -->
  <g id="sun">
    <rect x="790" y="155" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="880" y="190" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sun (energy)</text>
  </g>

  <g id="evaporation">
    <rect x="790" y="255" width="180" height="70" fill="#fff9c4" stroke="#000"/>
    <text x="880" y="290" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Evaporation</text>
  </g>

  <g id="transpiration">
    <rect x="1010" y="255" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="1100" y="290" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Transpiration</text>
  </g>

  <g id="condensation">
    <rect x="790" y="375" width="180" height="70" fill="#bbdefb" stroke="#000"/>
    <text x="880" y="410" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Condensation</text>
  </g>

  <g id="precipitation">
    <rect x="790" y="495" width="180" height="70" fill="#ffe0b2" stroke="#000"/>
    <text x="880" y="530" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Precipitation</text>
  </g>

  <g id="collection">
    <rect x="790" y="615" width="180" height="70" fill="#d7ccc8" stroke="#000"/>
    <text x="880" y="650" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Collection (lakes/oceans)</text>
  </g>

  <g id="infiltration_runoff">
    <rect x="570" y="615" width="180" height="70" fill="#f8bbd0" stroke="#000"/>
    <text x="660" y="650" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Infiltration / Runoff</text>
  </g>

  <g id="groundwater_flow">
    <rect x="570" y="495" width="180" height="70" fill="#d1c4e9" stroke="#000"/>
    <text x="660" y="530" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Groundwater Flow</text>
  </g>

  <!-- Edges -->
  <!-- Sun -> Evaporation -->
  <path d="M880,225 L880,255" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="235" text-anchor="middle" font-family="sans-serif" font-size="12">heat</text>

  <!-- Sun -> Transpiration -->
  <path d="M970,190 L1010,290" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="990" y="235" text-anchor="middle" font-family="sans-serif" font-size="12">energy</text>

  <!-- Evaporation -> Condensation -->
  <path d="M880,325 L880,375" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="350" text-anchor="middle" font-family="sans-serif" font-size="12">water vapor rises</text>

  <!-- Transpiration -> Condensation -->
  <path d="M1100,325 L880,375" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="990" y="350" text-anchor="middle" font-family="sans-serif" font-size="12">water vapor</text>

  <!-- Condensation -> Precipitation -->
  <path d="M880,445 L880,495" stroke="black"