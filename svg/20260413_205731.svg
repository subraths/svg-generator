<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect x="100" y="250" width="150" height="100" fill="#e0e0e0" stroke="black"/>
    <text x="175" y="300" font-family="sans-serif" font-size="20" text-anchor="middle" fill="black">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect x="750" y="250" width="150" height="100" fill="#e0e0e0" stroke="black"/>
    <text x="825" y="300" font-family="sans-serif" font-size="20" text-anchor="middle" fill="black">Server</text>
  </g>

  <!-- SYN arrow -->
  <g id="syn_arrow">
    <line x1="250" y1="300" x2="750" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">SYN (Seq = x)</text>
  </g>

  <!-- SYN-ACK arrow -->
  <g id="synack_arrow">
    <line x1="750" y1="320" x2="250" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="340" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">SYN‑ACK (Seq = y, Ack = x+1)</text>
  </g>

  <!-- ACK arrow -->
  <g id="ack_arrow">
    <line x1="250" y1="340" x2="750" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="360" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">ACK (Ack = y+1)</text>
  </g>

  <!-- Client state diagram -->
  <g id="client_states">
    <!-- CLOSED -->
    <rect x="100" y="380" width="100" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="150" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">CLOSED</text>
    <!-- SYN_SENT -->
    <rect x="230" y="380" width="100" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="280" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">SYN_SENT</text>
    <!-- ESTABLISHED -->
    <rect x="360" y="380" width="120" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="420" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">ESTABLISHED</text>
    <!-- Arrows between states -->
    <line x1="200" y1="400" x2="230" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="330" y1="400" x2="360" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Server state diagram -->
  <g id="server_states">
    <!-- CLOSED -->
    <rect x="750" y="380" width="100" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="800" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">CLOSED</text>
    <!-- SYN_RCVD -->
    <rect x="880" y="380" width="110" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="935" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">SYN_RCVD</text>
    <!-- ESTABLISHED -->
    <rect x="1010" y="380" width="120" height="40" fill="#f5f5f5" stroke="black"/>
    <text x="1070" y="405" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">ESTABLISHED</text>
    <!-- Arrows between states -->
    <line x1="850" y1="400" x2="880" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="990" y1="400" x2="1010" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
</svg>