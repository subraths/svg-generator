<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
    <style>
      .box { fill:#f0f0f0; stroke:#000; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect class="box" x="200" y="150" width="200" height="100"/>
    <text class="label" x="300" y="210" text-anchor="middle">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect class="box" x="800" y="150" width="200" height="100"/>
    <text class="label" x="900" y="210" text-anchor="middle">Server</text>
  </g>

  <!-- SYN arrow -->
  <g id="syn_arrow">
    <line class="arrow" x1="400" y1="200" x2="800" y2="200" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="180" text-anchor="middle">SYN (Seq = x)</text>
  </g>

  <!-- SYN-ACK arrow -->
  <g id="syn_ack_arrow">
    <line class="arrow" x1="800" y1="230" x2="400" y2="230" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="250" text-anchor="middle">SYN‑ACK (Seq = y, Ack = x+1)</text>
  </g>

  <!-- ACK arrow -->
  <g id="ack_arrow">
    <line class="arrow" x1="400" y1="300" x2="800" y2="300" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="280" text-anchor="middle">ACK (Ack = y+1)</text>
  </g>

  <!-- Connection established label -->
  <g id="connection_state">
    <text class="label" x="600" y="350" text-anchor="middle">Connection Established</text>
  </g>
</svg>