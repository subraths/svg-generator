<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0e0e0; stroke:#000; stroke-width:2; }
      .msg-line { stroke:#000; stroke-width:2; fill:none; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect class="box" x="100" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="200" y="360" text-anchor="middle" dominant-baseline="middle">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect class="box" x="900" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="1000" y="360" text-anchor="middle" dominant-baseline="middle">Server</text>
  </g>

  <!-- SYN message -->
  <g id="syn_message">
    <line class="msg-line" x1="300" y1="340" x2="700" y2="340" marker-end="url(#arrowhead)"/>
    <text class="label" x="500" y="320" text-anchor="middle">SYN</text>
  </g>

  <!-- SYN-ACK message -->
  <g id="synack_message">
    <line class="msg-line" x1="700" y1="360" x2="300" y2="360" marker-end="url(#arrowhead)"/>
    <text class="label" x="500" y="380" text-anchor="middle">SYN‑ACK</text>
  </g>

  <!-- ACK message -->
  <g id="ack_message">
    <line class="msg-line" x1="300" y1="400" x2="700" y2="400" marker-end="url(#arrowhead)"/>
    <text class="label" x="500" y="420" text-anchor="middle">ACK</text>
  </g>

  <!-- Established state -->
  <g id="established_state">
    <rect class="box" x="500" y="500" width="200" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="540" text-anchor="middle" dominant-baseline="middle">ESTABLISHED</text>
  </g>
</svg>