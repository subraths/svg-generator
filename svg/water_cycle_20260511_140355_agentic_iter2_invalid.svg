<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <g id="evaporation">
    <rect x="310" y="165" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="400" y="200" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Evaporation</text>
  </g>

  <g id="transpiration">
    <rect x="510" y="165" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="600" y="200" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Transpiration</text>
  </g>

  <g id="sublimation">
    <rect x="710" y="165" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="800" y="200" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sublimation</text>
  </g>

  <g id="condensation">
    <rect x="710" y="265" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="800" y="300" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Condensation</text>
  </g>

  <g id="precipitation">
    <rect x="710" y="465" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="800" y="500" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Precipitation</text>
  </g>

  <g id="collection">
    <rect x="510" y="565" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="600" y="600" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Collection (Lakes/Oceans)</text>
  </g>

  <g id="runoff">
    <rect x="310" y="565" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="400" y="600" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Runoff</text>
  </g>

  <g id="infiltration">
    <rect x="310" y="365" width="180" height="70" fill="#e0f7ff" stroke="#000"/>
    <text x="400" y="400" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Infiltration</text>
  </g>

  <g id="groundwater">
    <rect x="510" y="365" width="180" height="70" fill="#e0f