<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold">Transformer Architecture</text>

  <!-- Nodes -->
  <g id="input_embedding">
    <rect x="40" y="200" width="180" height="70" fill="white" stroke="black"/>
    <text x="130" y="235" text-anchor="middle" dominant-baseline="middle" font-size="14">Input Embedding</text>
  </g>

  <g id="positional_encoding">
    <rect x="260" y="200" width="180" height="70" fill="white" stroke="black"/>
    <text x="350" y="235" text-anchor="middle" dominant-baseline="middle" font-size="14">Positional Encoding</text>
  </g>

  <g id="encoder_self_attention">
    <rect x="480" y="140" width="180" height="70" fill="white" stroke="black"/>
    <text x="570" y="175" text-anchor="middle" dominant-baseline="middle" font-size="14">Encoder Self‑Attention</text>
  </g>

  <g id="encoder_feed_forward">
    <rect x="480" y="260" width="180" height="70" fill="white" stroke="black"/>
    <text x="570" y="295" text-anchor="middle" dominant-baseline="middle" font-size="14">Encoder Feed‑Forward</text>
  </g>

  <g id="encoder_output">
    <rect x="700" y="200" width="180" height="70" fill="white" stroke="black"/>
    <text x="790" y="235" text-anchor="middle" dominant-baseline="middle" font-size="14">Encoder Output</text>
  </g>

  <g id="decoder_self_attention">
    <rect x="940" y="140" width="180" height="70" fill="white" stroke="black"/>
    <text x="1030" y="175" text-anchor="middle" dominant-baseline="middle" font-size="14">Decoder Self‑Attention</text>
  </g>

  <g id="decoder_output">
    <rect x="940" y="260" width="180" height="70" fill="white" stroke="black"/>
    <text x="1030" y="295" text-anchor="middle" dominant-baseline="middle" font-size="14">Decoder Output</text>
  </g>

  <!-- Edges -->
  <line x1="220" y1="235" x2="260" y2="235" stroke="black" marker-end="url(#arrow)"/>
  <line x1="440" y1="235" x2="480" y2="175" stroke="black" marker-end="url(#arrow)"/>
  <line x1="570" y1="210" x2="570" y2="260" stroke="black" marker-end="url(#arrow)"/>
  <line x1="660" y1="295" x2="700" y2="235" stroke="black" marker-end="url(#arrow)"/>
  <line x1="880" y1="235" x2="940" y2="175" stroke="black" marker-end="url(#arrow)"/>
  <text x="910" y="200" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="black">cross‑attention</text>
  <line x1="1030" y1="210" x2="1030" y2="260" stroke="black" marker-end="url(#arrow)"/>
</svg>