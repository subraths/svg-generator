<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="36" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="70" y="185" width="180" height="70" fill="white" stroke="black"/>
    <text x="160" y="220" text-anchor="middle" dominant-baseline="middle" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="290" y="185" width="180" height="70" fill="white" stroke="black"/>
    <text x="380" y="220" text-anchor="middle" dominant-baseline="middle" font-size="14">Chlorophyll (light absorber)</text>
  </g>

  <g id="light_dependent">
    <rect x="510" y="185" width="180" height="70" fill="white" stroke="black"/>
    <text x="600" y="220" text-anchor="middle" dominant-baseline="middle" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="730" y="185" width="180" height="70" fill="white" stroke="black"/>
    <text x="820" y="220" text-anchor="middle" dominant-baseline="middle" font-size="14">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="950" y="185" width="180" height="70" fill="white" stroke="black"/>
    <text x="1040" y="220" text-anchor="middle" dominant-baseline="middle" font-size="14">O₂ Release</text>
  </g>

  <g id="atp_nadph">
    <rect x="730" y="305" width="180" height="70" fill="white" stroke="black"/>
    <text x="820" y="340" text-anchor="middle" dominant-baseline="middle" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="co2_fixation">
    <rect x="290" y="425" width="180" height="70" fill="white" stroke="black"/>
    <text x="380" y="460" text-anchor="middle" dominant-baseline="middle" font-size="14">CO₂ Fixation</text>
  </g>

  <g id="calvin_cycle">
    <rect x="510" y="425" width="180" height="70" fill="white" stroke="black"/>
    <text x="600" y="460" text-anchor="middle" dominant-baseline="middle" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="glucose_production">
    <rect x="730" y="545" width="180" height="70" fill="white" stroke="black"/>
    <text x="820" y="580" text-anchor="middle" dominant-baseline="middle" font-size="14">Glucose Production</text>
  </g>

  <!-- Edges -->
  <!-- sunlight -> chlorophyll -->
  <path d="M250,220 L290,220" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="210" text-anchor="middle" font-size="12">light</text>

  <!-- chlorophyll -> light_dependent -->
  <path d="M470,220 L510,220" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="490" y="210" text-anchor="middle" font-size="12">absorbs</text>

  <!-- light_dependent -> water_splitting -->
  <path d="M690,220 L730,220" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="210" text-anchor="middle" font-size="12">splits H₂O</text>

  <!-- water_splitting -> oxygen_release -->
  <path d="M910,220 L950,220" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="930" y="210" text-anchor="middle" font-size="12">O₂</text>

  <!-- light_dependent -> atp_nadph -->
  <path d="M690,220 L730,305" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="260" text-anchor="