<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .block { stroke:#333; stroke-width:2; rx:8; ry:8; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect class="block" x="50" y="100" width="110" height="80" fill="#cce5ff"/>
    <text class="label" x="105" y="140">Client (Browser)</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect class="block" x="180" y="100" width="110" height="80" fill="#d4edda"/>
    <text class="label" x="235" y="140">DNS Lookup</text>
  </g>

  <!-- TCP Handshake -->
  <g id="tcp_handshake">
    <rect class="block" x="310" y="100" width="110" height="80" fill="#fff3cd"/>
    <text class="label" x="365" y="140">TCP Handshake</text>
  </g>

  <!-- TLS Handshake -->
  <g id="tls_handshake">
    <rect class="block" x="440" y="100" width="110" height="80" fill="#f8d7da"/>
    <text class="label" x="495" y="140">TLS Handshake</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect class="block" x="570" y="100" width="110" height="80" fill="#e2e3e5"/>
    <text class="label" x="625" y="140">HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect class="block" x="700" y="100" width="110" height="80" fill="#d1ecf1"/>
    <text class="label" x="755" y="140">Server Processing</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect class="block" x="830" y="100" width="110" height="80" fill="#e2e3e5"/>
    <text class="label" x="885" y="140">HTTP Response</text>
  </g>

  <!-- Render Page -->
  <g id="render_page">
    <rect class="block" x="960" y="100" width="110" height="80" fill="#cce5ff"/>
    <text class="label" x="1015" y="140">Render Page</text>
  </g>

  <!-- Arrows -->
  <line x1="160" y1="140" x2="180" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="140" x2="310" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="140" x2="440" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="140" x2="570" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="140" x2="700" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="810" y1="140" x2="830" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="940" y1="140" x2="960" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>