<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="40" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="130" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sunlight</text>
  </g>

  <g id="water">
    <rect x="40" y="200" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="130" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water (H₂O)</text>
  </g>

  <g id="carbon_dioxide">
    <rect x="40" y="300" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="130" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Carbon Dioxide (CO₂)</text>
  </g>

  <g id="light_dependent">
    <rect x="260" y="150" width="180" height="70" fill="#fff9c4" stroke="#000"/>
    <text x="350" y="185" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑Dependent Reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="480" y="200" width="180" height="70" fill="#fff9c4" stroke="#000"/>
    <text x="570" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle (Light‑Independent)</text>
  </g>

  <g id="glucose">
    <rect x="700" y="200" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="790" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose (C₆H₁₂O₆)</text>
  </g>

  <g id="oxygen">
    <rect x="260" y="300" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="350" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Oxygen (O₂)</text>
  </g>

  <!-- Edges -->
  <line x1="130" y1="135" x2="350" y2="185" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="130" y1="235" x2="350" y2="185" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="185" x2="570" y2="235" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="185" x2="350" y2="335" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="130" y1="335" x2="570" y2="235" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="235" x2="790" y2="235" stroke="#000" marker-end="url(#arrowhead)"/>

  <!-- Edge Labels -->
  <text x="460" y="210" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">ATP/NADPH</text>
  <text x="350" y="260" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">O₂</text>
  <text x="680" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">C₆H₁₂O₆</text>
</svg>