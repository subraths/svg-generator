<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <style>
      .block { fill:#e0f7fa; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Sunlight -->
  <g id="sun_light">
    <rect class="block" x="50" y="50" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="140" y="90" text-anchor="middle" dominant-baseline="middle">Sunlight</text>
  </g>

  <!-- Chlorophyll (Leaf) -->
  <g id="chlorophyll">
    <rect class="block" x="300" y="50" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="390" y="90" text-anchor="middle" dominant-baseline="middle">Chlorophyll</text>
  </g>

  <!-- Water -->
  <g id="water">
    <rect class="block" x="50" y="300" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="140" y="340" text-anchor="middle" dominant-baseline="middle">Water (H₂O)</text>
  </g>

  <!-- Light‑dependent Reactions -->
  <g id="light_dependent">
    <rect class="block" x="300" y="300" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="390" y="340" text-anchor="middle" dominant-baseline="middle">Light‑dependent</text>
    <text class="label" x="390" y="365" text-anchor="middle" dominant-baseline="middle">Reactions</text>
  </g>

  <!-- Carbon Dioxide -->
  <g id="carbon_dioxide">
    <rect class="block" x="800" y="300" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="890" y="340" text-anchor="middle" dominant-baseline="middle">CO₂</text>
    <text class="label" x="890" y="365" text-anchor="middle" dominant-baseline="middle">Carbon Dioxide</text>
  </g>

  <!-- Calvin Cycle -->
  <g id="calvin_cycle">
    <rect class="block" x="550" y="300" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="640" y="340" text-anchor="middle" dominant-baseline="middle">Calvin Cycle</text>
  </g>

  <!-- Glucose -->
  <g id="glucose">
    <rect class="block" x="550" y="500" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="640" y="540" text-anchor="middle" dominant-baseline="middle">Glucose (C₆H₁₂O₆)</text>
  </g>

  <!-- Oxygen -->
  <g id="oxygen">
    <rect class="block" x="800" y="500" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="890" y="540" text-anchor="middle" dominant-baseline="middle">O₂ (Oxygen)</text>
  </g>

  <!-- Arrows -->
  <line x1="230" y1="90" x2="300" y2="90" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="130" x2="140" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="380" x2="390" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="340" x2="550" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="380" x2="640" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="540" x2="730" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>