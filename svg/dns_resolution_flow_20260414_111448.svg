<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .block { fill:#e0f7fa; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Application (Browser) -->
  <g id="application">
    <rect class="block" x="400" y="40" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="80">Application (Browser)</text>
  </g>

  <!-- Stub Resolver -->
  <g id="stub_resolver">
    <rect class="block" x="400" y="160" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="200">Stub Resolver (OS)</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect class="block" x="400" y="280" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="320">Recursive Resolver (ISP DNS)</text>
  </g>

  <!-- Root Name Server -->
  <g id="root_server">
    <rect class="block" x="400" y="400" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="440">Root Name Server</text>
  </g>

  <!-- TLD Name Server -->
  <g id="tld_server">
    <rect class="block" x="400" y="520" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="560">TLD Name Server (.com, .org, …)</text>
  </g>

  <!-- Authoritative Name Server -->
  <g id="authoritative_server">
    <rect class="block" x="400" y="640" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="680">Authoritative Name Server</text>
  </g>

  <!-- Final Response -->
  <g id="final_response">
    <rect class="block" x="400" y="760" width="400" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="800">IP Address Returned to Application</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="120" x2="600" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="240" x2="600" y2="280" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="360" x2="600" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="480" x2="600" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="600" x2="600" y2="640" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="720" x2="600" y2="760" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>