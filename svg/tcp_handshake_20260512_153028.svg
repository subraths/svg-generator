<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node-rect { fill:#f0f8ff; stroke:#000; stroke-width:2; }
      .node-label { font-family:Arial, Helvetica, sans-serif; font-size:16px; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
      .edge-label { font-family:Arial, Helvetica, sans-serif; font-size:14px; text-anchor:middle; dominant-baseline:middle; fill:#000; background:#fff; }
      .edge-line { fill:none; stroke:#000; stroke-width:2; marker-end:url(#arrow); }
      .title { font-family:Arial, Helvetica, sans-serif; font-size:24px; font-weight:bold; text-anchor:middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="50" class="title">TCP Handshake</text>

  <!-- Nodes -->
  <g id="client_syn">
    <rect x="350" y="385" width="180" height="70" class="node-rect"/>
    <text x="440" y="420" class="node-label">Client: SYN</text>
  </g>

  <g id="server_syn_ack">
    <rect x="550" y="385" width="180" height="70" class="node-rect"/>
    <text x="640" y="420" class="node-label">Server: SYN‑ACK</text>
  </g>

  <g id="client_ack">
    <rect x="750" y="385" width="180" height="70" class="node-rect"/>
    <text x="840" y="420" class="node-label">Client: ACK</text>
  </g>

  <g id="connection_established">
    <rect x="350" y="545" width="180" height="70" class="node-rect"/>
    <text x="440" y="580" class="node-label">Connection Established</text>
  </g>

  <g id="data_transfer">
    <rect x="550" y="545" width="180" height="70" class="node-rect"/>
    <text x="640" y="580" class="node-label">Data Transfer</text>
  </g>

  <g id="connection_termination">
    <rect x="750" y="545" width="180" height="70" class="node-rect"/>
    <text x="840" y="580" class="node-label">Connection Termination</text>
  </g>

  <!-- Edges -->
  <!-- client_syn -> server_syn_ack -->
  <line x1="530" y1="420" x2="550" y2="420" class="edge-line"/>
  <text x="540" y="410" class="edge-label">SYN</text>

  <!-- server_syn_ack -> client_ack -->
  <line x1="730" y1="420" x2="750" y2="420" class="edge-line"/>
  <text x="740" y="410" class="edge-label">SYN‑ACK</text>

  <!-- client_ack -> connection_established -->
  <line x1="840" y1="455" x2="440" y2="545" class="edge-line"/>
  <text x="640" y="500" class="edge-label">ACK</text>

  <!-- connection_established -> data_transfer -->
  <line x1="530" y1="580" x2="550" y2="580" class="edge-line"/>
  <text x="540" y="570" class="edge-label">establish</text>

  <!-- data_transfer -> connection_termination -->
  <line x1="730" y1="580" x2="750" y2="580" class="edge-line"/>
  <text x="740" y="570" class="edge-label">FIN</text>
</svg>