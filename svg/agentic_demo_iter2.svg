<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <g id="input_layer">
    <rect x="20" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="110" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Input Layer</text>
  </g>

  <g id="convolutional_layer">
    <rect x="220" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="310" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Convolutional Layer</text>
  </g>

  <g id="batch_norm_layer">
    <rect x="220" y="390" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="310" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Batch Norm</text>
  </g>

  <g id="activation_layer">
    <rect x="220" y="480" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="310" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Activation (ReLU)</text>
  </g>

  <g id="pooling_layer">
    <rect x="420" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="510" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Pooling Layer</text>
  </g>

  <g id="flatten_layer">
    <rect x="620" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="710" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Flatten Layer</text>
  </g>

  <g id="dense_layer">
    <rect x="820" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="910" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Dense Layer</text>
  </g>

  <g id="dropout_layer">
    <rect x="820" y="390" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="910" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Dropout</text>
  </g>

  <g id="output_layer">
    <rect x="1020" y="300" width="180" height="70" fill="#e0e0e0" stroke="#000"/>
    <text x="1110" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Output Layer</text>
  </g>

  <!-- Edges -->
  <path d="M200,335 L220,335" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="210" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">input</text>

  <path d="M310,370 L310,390" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="295" y="380" font-family="sans-serif" font-size="12">BN</text>

  <path d="M310,460 L310,480" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="295" y="470" font-family="sans-serif" font-size="12">ReLU</text>

  <path d="M400,515 C450,515 420,400 420,335" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="430" y="460" font-family="sans-serif" font-size="12">downsample</text>

  <path d="M600,335 L620,335" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="610" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">reshape</text>

  <path d="M800,335 L820,335" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="810" y="325" text-anchor="middle" font-family="sans-serif" font-size="12">FC</text>

  <path d="M910,370 L910,390" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="895" y="380" font-family="sans-serif" font-size="12">dropout</text>

  <path d="M1000,425 C1050,425 1020,360 1020,335" stroke="#000" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1030" y="400" font-family="sans-serif" font-size="12">logits</text>
</svg>