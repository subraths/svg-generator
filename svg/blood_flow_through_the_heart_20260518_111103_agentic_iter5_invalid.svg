<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-family="sans-serif">Blood Flow Through the Heart</text>

  <!-- Nodes -->
  <g id="vena_cava">
    <rect x="360" y="65" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="105" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Superior &amp; Inferior Vena Cava</text>
  </g>

  <g id="right_atrium">
    <rect x="360" y="135" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="175" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Right Atrium</text>
  </g>

  <g id="tricuspid_valve">
    <rect x="360" y="205" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="245" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Tricuspid Valve</text>
  </g>

  <g id="right_ventricle">
    <rect x="360" y="275" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="315" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Right Ventricle</text>
  </g>

  <g id="pulmonary_valve">
    <rect x="360" y="345" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="385" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Pulmonary Valve</text>
  </g>

  <g id="pulmonary_artery">
    <rect x="360" y="415" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="455" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Pulmonary Artery</text>
  </g>

  <g id="lungs">
    <rect x="360" y="485" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="450" y="525" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Lungs (Capillaries)</text>
  </g>

  <g id="pulmonary_veins">
    <rect x="660" y="65" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="105" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Pulmonary Veins</text>
  </g>

  <g id="left_atrium">
    <rect x="660" y="135" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="175" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Left Atrium</text>
  </g>

  <g id="mitral_valve">
    <rect x="660" y="205" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="245" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Mitral Valve</text>
  </g>

  <g id="left_ventricle">
    <rect x="660" y="275" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="315" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Left Ventricle</text>
  </g>

  <g id="aortic_valve">
    <rect x="660" y="345" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="385" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Aortic Valve</text>
  </g>

  <g id="aorta">
    <rect x="660" y="415" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="750" y="455" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Aorta</text>
  </g>

  <!-- Edges -->
  <!-- vena_cava -> right_atrium -->
  <path d="M450,135 L450,135" fill="none"/>
  <line x1="450" y1="135" x2="450" y2="135" stroke="black" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="135" x2="450" y2="135" stroke="black"/>
  <line x1="450" y1="135" x2="450" y2="