<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#000000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Application request -->
  <g id="application">
    <rect class="box" x="450" y="50" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="90">Application request</text>
  </g>

  <!-- Stub resolver -->
  <g id="stub_resolver">
    <rect class="box" x="450" y="170" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="210">Stub resolver (client)</text>
  </g>

  <!-- Recursive resolver -->
  <g id="recursive_resolver">
    <rect class="box" x="450" y="290" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="330">Recursive resolver (DNS server)</text>
  </g>

  <!-- Root name server -->
  <g id="root_server">
    <rect class="box" x="450" y="410" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="450">Root name server</text>
  </g>

  <!-- TLD name server -->
  <g id="tld_server">
    <rect class="box" x="450" y="530" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="570">TLD name server</text>
  </g>

  <!-- Authoritative name server -->
  <g id="authoritative_server">
    <rect class="box" x="450" y="650" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="690">Authoritative name server</text>
  </g>

  <!-- Arrows -->
  <line x1="600" y1="130" x2="600" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="600" y2="410" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="610" x2="600" y2="650" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Return path (response) -->
  <line x1="600" y1="730" x2="600" y2="690" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="610" x2="600" y2="570" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="600" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="250" x2="600" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="130" x2="600" y2="90" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Response label -->
  <g id="response_label">
    <text class="label" x="800" y="400" font-size="16">Response travels back up the chain</text>
  </g>
</svg>