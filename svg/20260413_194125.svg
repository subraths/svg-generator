<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; marker-end:url(#arrowhead); }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Sunlight -->
  <g id="sunlight">
    <rect class="box" x="100" y="50" width="150" height="60"/>
    <text class="label" x="175" y="80" text-anchor="middle" dominant-baseline="middle">Sunlight</text>
  </g>

  <!-- Chlorophyll -->
  <g id="chlorophyll">
    <rect class="box" x="350" y="50" width="200" height="60"/>
    <text class="label" x="450" y="80" text-anchor="middle" dominant-baseline="middle">Chlorophyll (in chloroplast)</text>
  </g>

  <!-- Water -->
  <g id="water">
    <rect class="box" x="100" y="200" width="150" height="60"/>
    <text class="label" x="175" y="230" text-anchor="middle" dominant-baseline="middle">Water (H₂O)</text>
  </g>

  <!-- Carbon Dioxide -->
  <g id="carbon_dioxide">
    <rect class="box" x="750" y="200" width="150" height="60"/>
    <text class="label" x="825" y="230" text-anchor="middle" dominant-baseline="middle">CO₂</text>
  </g>

  <!-- Light‑dependent Reactions -->
  <g id="light_dependent">
    <rect class="box" x="350" y="200" width="250" height="80"/>
    <text class="label" x="475" y="240" text-anchor="middle" dominant-baseline="middle">Light‑dependent Reactions</text>
  </g>

  <!-- Calvin Cycle -->
  <g id="calvin_cycle">
    <rect class="box" x="350" y="350" width="250" height="80"/>
    <text class="label" x="475" y="390" text-anchor="middle" dominant-baseline="middle">Calvin Cycle (Light‑independent)</text>
  </g>

  <!-- Glucose -->
  <g id="glucose">
    <rect class="box" x="150" y="500" width="150" height="60"/>
    <text class="label" x="225" y="530" text-anchor="middle" dominant-baseline="middle">Glucose (C₆H₁₂O₆)</text>
  </g>

  <!-- Oxygen -->
  <g id="oxygen">
    <rect class="box" x="700" y="500" width="150" height="60"/>
    <text class="label" x="775" y="530" text-anchor="middle" dominant-baseline="middle">Oxygen (O₂)</text>
  </g>

  <!-- Arrows -->
  <!-- Sunlight → Light‑dependent -->
  <line class="arrow" x1="250" y1="80" x2="350" y2="240"/>
  <!-- Water → Light‑dependent -->
  <line class="arrow" x1="250" y1="230" x2="350" y2="240"/>
  <!-- Light‑dependent → Calvin Cycle -->
  <line class="arrow" x1="475" y1="280" x2="475" y2="350"/>
  <!-- Light‑dependent → Oxygen -->
  <line class="arrow" x1="600" y1="280" x2="700" y2="530"/>
  <!-- CO₂ → Calvin Cycle -->
  <line class="arrow" x1="750" y1="230" x2="350" y2="390"/>
  <!-- Calvin Cycle → Glucose -->
  <line class="arrow" x1="350" y1="390" x2="300" y2="530"/>
  <!-- Calvin Cycle → Oxygen -->
  <line class="arrow" x1="600" y1="390" x2="700" y2="530"/>
</svg>