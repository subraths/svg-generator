<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#f0f8ff; stroke:#333; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Pending -->
  <g id="pending">
    <rect class="box" x="450" y="50" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="90">Pending</text>
  </g>

  <!-- Scheduling -->
  <g id="scheduling">
    <rect class="box" x="450" y="160" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="200">Scheduling</text>
  </g>

  <!-- Container Creating -->
  <g id="container_creating">
    <rect class="box" x="450" y="270" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="310">ContainerCreating</text>
  </g>

  <!-- Running -->
  <g id="running">
    <rect class="box" x="450" y="380" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="420">Running</text>
  </g>

  <!-- Succeeded -->
  <g id="succeeded">
    <rect class="box" x="250" y="590" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="400" y="630">Succeeded</text>
  </g>

  <!-- Failed -->
  <g id="failed">
    <rect class="box" x="650" y="590" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="800" y="630">Failed</text>
  </g>

  <!-- Terminating -->
  <g id="terminating">
    <rect class="box" x="450" y="700" width="300" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="740">Terminating</text>
  </g>

  <!-- Connectors -->
  <!-- Pending -> Scheduling -->
  <line x1="600" y1="130" x2="600" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Scheduling -> ContainerCreating -->
  <line x1="600" y1="240" x2="600" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- ContainerCreating -> Running -->
  <line x1="600" y1="350" x2="600" y2="380" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Running -> Succeeded -->
  <line x1="600" y1="460" x2="500" y2="590" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Running -> Failed -->
  <line x1="600" y1="460" x2="700" y2="590" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Succeeded -> Terminating -->
  <line x1="400" y1="670" x2="600" y2="700" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Failed -> Terminating -->
  <line x1="800" y1="670" x2="600" y2="700" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>