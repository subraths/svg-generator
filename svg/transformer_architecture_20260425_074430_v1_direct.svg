<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Input Embedding -->
  <g id="input_embedding">
    <rect x="50" y="300" width="150" height="80" fill="#e0f7fa" stroke="#000" stroke-width="2"/>
    <text x="125" y="345" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Input Embedding</text>
  </g>

  <!-- Positional Encoding -->
  <g id="positional_encoding">
    <rect x="250" y="300" width="150" height="80" fill="#e8f5e9" stroke="#000" stroke-width="2"/>
    <text x="325" y="345" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Positional Encoding</text>
  </g>

  <!-- Encoder Stack -->
  <g id="encoder_stack">
    <rect x="450" y="150" width="250" height="250" fill="#fff3e0" stroke="#000" stroke-width="2"/>
    <text x="575" y="190" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#000">Encoder</text>
    <text x="575" y="220" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Self‑Attention</text>
    <text x="575" y="250" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Add &amp; Norm</text>
    <text x="575" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Feed‑Forward</text>
    <text x="575" y="310" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Add &amp; Norm</text>
  </g>

  <!-- Decoder Stack -->
  <g id="decoder_stack">
    <rect x="750" y="150" width="250" height="250" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
    <text x="875" y="190" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#000">Decoder</text>
    <text x="875" y="220" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Self‑Attention</text>
    <text x="875" y="250" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Add &amp; Norm</text>
    <text x="875" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Enc‑Dec Attention</text>
    <text x="875" y="310" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Add &amp; Norm</text>
    <text x="875" y="340" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Feed‑Forward</text>
    <text x="875" y="370" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Add &amp; Norm</text>
  </g>

  <!-- Output Projection -->
  <g id="output_projection">
    <rect x="1050" y="300" width="120" height="80" fill="#e1f5fe" stroke="#000" stroke-width="2"/>
    <text x="1110" y="345" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Output Linear</text>
  </g>

  <!-- Softmax -->
  <g id="softmax">
    <rect x="1050" y="420" width="120" height="80" fill="#fffde7" stroke="#000" stroke-width="2"/>
    <text x="1110" y="465" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Softmax</text>
  </g>

  <!-- Connectors -->
  <!-- Input Embedding → Positional Encoding -->
  <line x1="200" y1="340" x2="250" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Positional Encoding → Encoder -->
  <line x1="400" y1="340" x2="450" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Encoder → Decoder (main flow) -->
  <line x1="700" y1="275" x2="750" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Encoder → Decoder (attention link) -->
  <line x1="700" y1="250" x2="750" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Decoder → Output Projection -->
  <line x1="1000" y1="275" x2="1050" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Output Projection → Softmax -->
  <line x1="1110" y1="380" x2="1110" y2="420" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>