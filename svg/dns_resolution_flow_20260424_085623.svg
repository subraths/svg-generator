<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .label { font-family:sans-serif; font-size:16px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- Application request -->
  <g id="application_request">
    <rect class="box" x="30" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="105" y="400">Application<br/>Request</text>
  </g>

  <!-- Stub resolver -->
  <g id="stub_resolver">
    <rect class="box" x="200" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="275" y="400">Stub Resolver</text>
  </g>

  <!-- Recursive resolver -->
  <g id="recursive_resolver">
    <rect class="box" x="370" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="445" y="400">Recursive Resolver</text>
  </g>

  <!-- Root name server -->
  <g id="root_server">
    <rect class="box" x="540" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="615" y="400">Root Server</text>
  </g>

  <!-- TLD name server -->
  <g id="tld_server">
    <rect class="box" x="710" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="785" y="400">TLD Server</text>
  </g>

  <!-- Authoritative name server -->
  <g id="authoritative_server">
    <rect class="box" x="880" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="955" y="400">Authoritative Server</text>
  </g>

  <!-- Final response -->
  <g id="final_response">
    <rect class="box" x="1050" y="360" width="150" height="80" rx="8"/>
    <text class="label" x="1125" y="400">Response<br/>to Application</text>
  </g>

  <!-- Forward arrows -->
  <line class="arrow" x1="180" y1="400" x2="200" y2="400" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="350" y1="400" x2="370" y2="400" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="520" y1="400" x2="540" y2="400" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="690" y1="400" x2="710" y2="400" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="860" y1="400" x2="880" y2="400" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="1030" y1="400" x2="1050" y2="400" marker-end="url(#arrowhead)"/>

  <!-- Response arrows (backwards) -->
  <line class="arrow" x1="1030" y1="440" x2="880" y2="440" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="860" y1="460" x2="710" y2="460" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="690" y1="480" x2="540" y2="480" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="520" y1="500" x2="370" y2="500" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="350" y1="520" x2="200" y2="520" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="180" y1="540" x2="30" y2="540" marker-end="url(#arrowhead)"/>

  <!-- Labels for response arrows -->
  <text class="label" x="955" y="440">Answer</text>
  <text class="label" x="785" y="460">Answer</text>
  <text class="label" x="615" y="480">Answer</text>
  <text class="label" x="445" y="500">Answer</text>
  <text class="label" x="275" y="520">Answer</text>
  <text class="label" x="105" y="540">Answer</text>
</svg>