<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Pod Created -->
  <g id="pod_created">
    <rect x="450" y="30" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="60" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Pod Created</text>
  </g>

  <!-- Pending -->
  <g id="pending">
    <rect x="450" y="130" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="160" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Pending</text>
  </g>

  <!-- Container Creating -->
  <g id="container_creating">
    <rect x="450" y="230" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="260" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">ContainerCreating</text>
  </g>

  <!-- Running -->
  <g id="running">
    <rect x="450" y="330" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="360" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Running</text>
  </g>

  <!-- Succeeded -->
  <g id="succeeded">
    <rect x="450" y="430" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="460" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Succeeded</text>
  </g>

  <!-- Failed -->
  <g id="failed">
    <rect x="450" y="530" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="560" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Failed</text>
  </g>

  <!-- Terminating -->
  <g id="terminating">
    <rect x="800" y="330" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="950" y="360" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Terminating</text>
  </g>

  <!-- Unknown -->
  <g id="unknown">
    <rect x="100" y="330" width="300" height="60" fill="#e0f7fa" stroke="black"/>
    <text x="250" y="360" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Unknown</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="90" x2="600" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="190" x2="600" y2="230" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="290" x2="600" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="390" x2="600" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="360" x2="800" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="950" y1="390" x2="600" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="360" x2="450" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>