<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Browser -->
  <g id="browser">
    <rect x="50" y="100" width="180" height="60" fill="#e0f7fa" stroke="#000"/>
    <text x="140" y="135" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Browser</text>
  </g>

  <!-- OS Resolver -->
  <g id="os_resolver">
    <rect x="300" y="100" width="200" height="60" fill="#fff3e0" stroke="#000"/>
    <text x="400" y="135" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">OS Resolver</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect x="550" y="100" width="200" height="60" fill="#e8f5e9" stroke="#000"/>
    <text x="650" y="135" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Recursive Resolver</text>
  </g>

  <!-- Root Server -->
  <g id="root_server">
    <rect x="550" y="250" width="150" height="60" fill="#f3e5f5" stroke="#000"/>
    <text x="625" y="285" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Root Server</text>
  </g>

  <!-- TLD Server -->
  <g id="tld_server">
    <rect x="550" y="350" width="150" height="60" fill="#ffebee" stroke="#000"/>
    <text x="625" y="385" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">TLD Server</text>
  </g>

  <!-- Authoritative Server -->
  <g id="authoritative_server">
    <rect x="550" y="450" width="200" height="60" fill="#e1f5fe" stroke="#000"/>
    <text x="650" y="485" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Authoritative Server</text>
  </g>

  <!-- Web Page (final response) -->
  <g id="final_response">
    <rect x="50" y="500" width="180" height="60" fill="#fffde7" stroke="#000"/>
    <text x="140" y="535" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000">Web Page</text>
  </g>

  <!-- Arrows (forward) -->
  <line x1="230" y1="130" x2="300" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="130" x2="550" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="160" x2="625" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="310" x2="625" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="410" x2="650" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="130" y1="160" x2="140" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrows (response) -->
  <line x1="650" y1="510" x2="650" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="130" x2="500" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="130" x2="230" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>