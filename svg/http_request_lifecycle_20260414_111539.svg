<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect x="50" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="125" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">Client (Browser)</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect x="250" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="325" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">DNS Lookup</text>
  </g>

  <!-- TCP Handshake -->
  <g id="tcp_handshake">
    <rect x="450" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="525" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">TCP Handshake</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect x="650" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="725" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect x="850" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="925" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">Server Processing</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect x="1050" y="100" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="1125" y="140" text-anchor="middle" dominant-baseline="middle" font-size="18">HTTP Response</text>
  </g>

  <!-- Browser Rendering -->
  <g id="rendering">
    <rect x="50" y="300" width="150" height="80" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <text x="125" y="340" text-anchor="middle" dominant-baseline="middle" font-size="18">Browser Rendering</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="140" x2="250" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="450" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="140" x2="650" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="140" x2="850" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1000" y1="140" x2="1050" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1125" y1="140" x2="125" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>