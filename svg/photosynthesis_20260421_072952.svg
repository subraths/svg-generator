<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="100" y="100" width="180" height="70" fill="#f9f9a9" stroke="black"/>
    <text x="190" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sunlight</text>
  </g>

  <g id="water_absorption">
    <rect x="100" y="200" width="180" height="70" fill="#c9e6ff" stroke="black"/>
    <text x="190" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water (H₂O) uptake</text>
  </g>

  <g id="carbon_dioxide">
    <rect x="100" y="300" width="180" height="70" fill="#c9ffd9" stroke="black"/>
    <text x="190" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">CO₂ intake</text>
  </g>

  <g id="light_dependent">
    <rect x="340" y="140" width="180" height="70" fill="#fff4c9" stroke="black"/>
    <text x="430" y="175" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑dependent reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="580" y="260" width="180" height="70" fill="#e6c9ff" stroke="black"/>
    <text x="670" y="295" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin cycle (light‑independent)</text>
  </g>

  <g id="glucose_production">
    <rect x="820" y="200" width="180" height="70" fill="#ffd9c9" stroke="black"/>
    <text x="910" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose (C₆H₁₂O₆) produced</text>
  </g>

  <g id="oxygen_release">
    <rect x="820" y="320" width="180" height="70" fill="#c9fff4" stroke="black"/>
    <text x="910" y="355" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Oxygen (O₂) released</text>
  </g>

  <!-- Edges -->
  <g id="edges">
    <!-- Sunlight → Light‑dependent -->
    <line x1="280" y1="135" x2="340" y2="175" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="310" y="150" text-anchor="middle" font-family="sans-serif" font-size="12">provides energy</text>

    <!-- Water absorption → Light‑dependent -->
    <line x1="280" y1="235" x2="340" y2="175" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="310" y="200" text-anchor="middle" font-family="sans-serif" font-size="12">splits (photolysis)</text>

    <!-- Light‑dependent → Calvin cycle -->
    <line x1="520" y1="175" x2="580" y2="295" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="550" y="230" text-anchor="middle" font-family="sans-serif" font-size="12">produces ATP/NADPH</text>

    <!-- Carbon dioxide → Calvin cycle -->
    <line x1="280" y1="335" x2="580" y2="295" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="430" y="310" text-anchor="middle" font-family="sans-serif" font-size="12">CO₂ fixation</text>

    <!-- Calvin cycle → Glucose production -->
    <line x1="760" y1="295" x2="820" y2="235" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="790" y="260" text-anchor="middle" font-family="sans-serif" font-size="12">synthesizes glucose</text>

    <!-- Light‑dependent → Oxygen release -->
    <line x1="520" y1="175" x2="820" y2="355" stroke="black" marker-end="url(#arrowhead)"/>
    <text x="670" y="260" text-anchor="middle" font-family="sans-serif" font-size="12">releases O₂</text>
  </g>
</svg>