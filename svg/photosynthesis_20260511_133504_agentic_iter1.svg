<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="20" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="light_absorption">
    <rect x="20" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="110" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light Absorption</text>
  </g>

  <g id="water_split">
    <rect x="220" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="310" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Splitting (Photolysis)</text>
  </g>

  <g id="electron_transport">
    <rect x="420" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="510" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Electron Transport Chain</text>
  </g>

  <g id="atp_synthesis">
    <rect x="620" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="710" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">ATP &amp; NADPH Synthesis</text>
  </g>

  <g id="carbon_fixation">
    <rect x="820" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="910" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Carbon Fixation (Calvin Cycle)</text>
  </g>

  <g id="glucose_production">
    <rect x="1020" y="40" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="1110" y="75" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="220" y="140" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="310" y="175" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">O₂ Release</text>
  </g>

  <!-- Edges -->
  <!-- light_absorption → water_split -->
  <line x1="200" y1="75" x2="220" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">photons</text>

  <!-- water_split → electron_transport -->
  <line x1="400" y1="75" x2="420" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">e⁻, H⁺</text>

  <!-- electron_transport → atp_synthesis -->
  <line x1="600" y1="75" x2="620" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">ATP, NADPH</text>

  <!-- atp_synthesis → carbon_fixation -->
  <line x1="800" y1="75" x2="820" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="810" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">energy</text>

  <!-- carbon_fixation → glucose_production -->
  <line x1="1000" y1="75" x2="1020" y2="75" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="1010" y="65" text-anchor="middle" font-family="sans-serif" font-size="12">C₃ sugar</text>

  <!-- water_split → oxygen_release -->
  <line x1="310" y1="110" x2="310" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="125" font-family="sans-serif" font-size="12">O₂</text>
</svg>