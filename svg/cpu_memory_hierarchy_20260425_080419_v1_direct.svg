<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" font-family="sans-serif" font-size="24" text-anchor="middle">CPU Memory Hierarchy</text>

  <!-- CPU Core -->
  <g id="cpu_core">
    <rect x="200" y="50" width="800" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="90" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">CPU Core</text>
  </g>

  <!-- Registers -->
  <g id="registers">
    <rect x="200" y="160" width="800" height="80" fill="#b2ebf2" stroke="black"/>
    <text x="600" y="200" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect x="200" y="270" width="800" height="80" fill="#80deea" stroke="black"/>
    <text x="600" y="310" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L1 Cache (Fastest)</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect x="200" y="380" width="800" height="80" fill="#4dd0e1" stroke="black"/>
    <text x="600" y="420" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L2 Cache</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect x="200" y="490" width="800" height="80" fill="#26c6da" stroke="black"/>
    <text x="600" y="530" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L3 Cache</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect x="200" y="600" width="800" height="80" fill="#00bcd4" stroke="black"/>
    <text x="600" y="640" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect x="200" y="710" width="800" height="80" fill="#0097a7" stroke="black"/>
    <text x="600" y="750" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="130" x2="600" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="240" x2="600" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="350" x2="600" y2="380" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="460" x2="600" y2="490" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="570" x2="600" y2="600" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="680" x2="600" y2="710" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>