<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node { fill:#e0f7ff; stroke:#000; stroke-width:1.5px; }
      .edge { stroke:#000; stroke-width:1.5px; fill:none; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:14px; fill:#000; }
      .title { font-family:Arial,Helvetica,sans-serif; font-size:24px; font-weight:bold; fill:#000; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="200" y="275" width="180" height="70" class="node"/>
    <text x="290" y="312.5" text-anchor="middle" dominant-baseline="middle" class="label">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="420" y="275" width="180" height="70" class="node"/>
    <text x="510" y="312.5" text-anchor="middle" dominant-baseline="middle" class="label">Chlorophyll (pigment)</text>
  </g>

  <g id="water_splitting">
    <rect x="640" y="275" width="180" height="70" class="node"/>
    <text x="730" y="312.5" text-anchor="middle" dominant-baseline="middle" class="label">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="860" y="275" width="180" height="70" class="node"/>
    <text x="950" y="312.5" text-anchor="middle" dominant-baseline="middle" class="label">Oxygen Release</text>
  </g>

  <g id="light_dependent_reactions">
    <rect x="420" y="375" width="180" height="70" class="node"/>
    <text x="510" y="412.5" text-anchor="middle" dominant-baseline="middle" class="label">Light‑Dependent Reactions</text>
  </g>

  <g id="atp_nadph_production">
    <rect x="640" y="375" width="180" height="70" class="node"/>
    <text x="730" y="412.5" text-anchor="middle" dominant-baseline="middle" class="label">ATP &amp; NADPH Production</text>
  </g>

  <g id