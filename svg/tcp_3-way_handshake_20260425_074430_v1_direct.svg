<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#f9f9f9; stroke:#000; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect x="100" y="250" width="200" height="100" class="box"/>
    <text x="200" y="300" text-anchor="middle" class="label">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect x="900" y="250" width="200" height="100" class="box"/>
    <text x="1000" y="300" text-anchor="middle" class="label">Server</text>
  </g>

  <!-- SYN message -->
  <g id="syn_message">
    <line x1="300" y1="300" x2="900" y2="300" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="600" y="280" text-anchor="middle" class="label">SYN (Seq = x)</text>
  </g>

  <!-- SYN-ACK message -->
  <g id="synack_message">
    <line x1="900" y1="350" x2="300" y2="350" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="600" y="370" text-anchor="middle" class="label">SYN‑ACK (Seq = y, Ack = x+1)</text>
  </g>

  <!-- ACK message -->
  <g id="ack_message">
    <line x1="300" y1="400" x2="900" y2="400" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="600" y="380" text-anchor="middle" class="label">ACK (Ack = y+1)</text>
  </g>

  <!-- Connection established note -->
  <g id="connection_established">
    <text x="600" y="500" text-anchor="middle" class="label">Connection Established</text>
    <line x1="600" y1="460" x2="600" y2="480" class="arrow" marker-end="url(#arrowhead)"/>
  </g>
</svg>