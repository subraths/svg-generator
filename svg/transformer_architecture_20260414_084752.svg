<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#000000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:16px; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#000000; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- Input Tokens -->
  <g id="input_tokens">
    <rect class="box" x="50" y="300" width="120" height="60"/>
    <text class="label" x="110" y="330">Input Tokens</text>
  </g>

  <!-- Embedding -->
  <g id="embedding">
    <rect class="box" x="200" y="300" width="120" height="60"/>
    <text class="label" x="260" y="330">Embedding</text>
  </g>

  <!-- Positional Encoding -->
  <g id="positional_encoding">
    <rect class="box" x="350" y="300" width="150" height="60"/>
    <text class="label" x="425" y="330">Positional Encoding</text>
  </g>

  <!-- Encoder Stack -->
  <g id="encoder_stack">
    <rect class="box" x="550" y="200" width="200" height="300"/>
    <text class="label" x="650" y="350">Encoder Stack (N layers)</text>
  </g>

  <!-- Decoder Stack -->
  <g id="decoder_stack">
    <rect class="box" x="800" y="200" width="200" height="300"/>
    <text class="label" x="900" y="350">Decoder Stack (N layers)</text>
  </g>

  <!-- Output Projection -->
  <g id="output_projection">
    <rect class="box" x="550" y="550" width="200" height="60"/>
    <text class="label" x="650" y="580">Linear + Softmax</text>
  </g>

  <!-- Output Tokens -->
  <g id="output_tokens">
    <rect class="box" x="800" y="560" width="120" height="40"/>
    <text class="label" x="860" y="580">Output Tokens</text>
  </g>

  <!-- Arrows -->
  <line class="arrow" x1="170" y1="330" x2="200" y2="330" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="320" y1="330" x2="350" y2="330" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="500" y1="330" x2="550" y2="330" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="750" y1="350" x2="800" y2="350" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="900" y1="500" x2="650" y2="580" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="750" y1="580" x2="800" y2="580" marker-end="url(#arrowhead)"/>
</svg>