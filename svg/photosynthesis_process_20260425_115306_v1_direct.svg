<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Sunlight -->
  <g id="sunlight">
    <rect x="100" y="50" width="200" height="80" fill="#FFEE88" stroke="black"/>
    <text x="200" y="105" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Sunlight</text>
  </g>

  <!-- Leaf (chloroplast) -->
  <g id="leaf">
    <rect x="500" y="200" width="300" height="200" fill="#A8D5BA" stroke="black"/>
    <text x="650" y="300" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Leaf (Chloroplast)</text>
  </g>

  <!-- Light‑dependent reactions -->
  <g id="light_dependent">
    <rect x="850" y="150" width="250" height="120" fill="#FFF79A" stroke="black"/>
    <text x="975" y="210" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Light‑Dependent Reactions</text>
  </g>

  <!-- Oxygen release -->
  <g id="oxygen_release">
    <rect x="950" y="400" width="200" height="80" fill="#B3E5FC" stroke="black"/>
    <text x="1050" y="440" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">O₂ Release</text>
  </g>

  <!-- Calvin cycle -->
  <g id="calvin_cycle">
    <rect x="150" y="400" width="250" height="150" fill="#FFCC80" stroke="black"/>
    <text x="275" y="475" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Calvin Cycle</text>
  </g>

  <!-- Glucose -->
  <g id="glucose">
    <rect x="850" y="600" width="250" height="80" fill="#F8BBD0" stroke="black"/>
    <text x="975" y="640" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Glucose</text>
  </g>

  <!-- Arrows -->
  <!-- Sunlight → Light‑Dependent Reactions -->
  <line x1="300" y1="90" x2="850" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Light‑Dependent Reactions → O₂ Release -->
  <line x1="1100" y1="210" x2="950" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Light‑Dependent Reactions → Calvin Cycle (via path to avoid leaf) -->
  <path d="M975,270 V500 H275 V400" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Calvin Cycle → Glucose -->
  <line x1="400" y1="475" x2="850" y2="640" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>