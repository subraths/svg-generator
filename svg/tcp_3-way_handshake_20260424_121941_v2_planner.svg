<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">
    TCP 3-way Handshake
  </text>

  <!-- Nodes -->
  <g id="client_syn">
    <rect x="40" y="100" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="130" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Client: SYN
    </text>
  </g>

  <g id="server_syn_ack">
    <rect x="260" y="100" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="350" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Server: SYN-ACK
    </text>
  </g>

  <g id="client_ack">
    <rect x="480" y="100" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="570" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Client: ACK
    </text>
  </g>

  <g id="connection_established">
    <rect x="40" y="240" width="180" height="70" fill="#fff9c4" stroke="black"/>
    <text x="130" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Connection Established
    </text>
  </g>

  <g id="data_transfer">
    <rect x="260" y="240" width="180" height="70" fill="#fff9c4" stroke="black"/>
    <text x="350" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Data Transfer
    </text>
  </g>

  <g id="connection_termination">
    <rect x="480" y="240" width="180" height="70" fill="#fff9c4" stroke="black"/>
    <text x="570" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">
      Connection Termination
    </text>
  </g>

  <!-- Edges -->
  <!-- client_syn -> server_syn_ack -->
  <line x1="220" y1="135" x2="260" y2="135" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="125" text-anchor="middle" font-family="sans-serif" font-size="12">SYN</text>

  <!-- server_syn_ack -> client_ack -->
  <line x1="440" y1="135" x2="480" y2="135" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="125" text-anchor="middle" font-family="sans-serif" font-size="12">SYN-ACK</text>

  <!-- client_ack -> connection_established -->
  <line x1="570" y1="170" x2="130" y2="240" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="350" y="195" text-anchor="middle" font-family="sans-serif" font-size="12">ACK</text>

  <!-- connection_established -> data_transfer -->
  <line x1="220" y1="275" x2="260" y2="275" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="265" text-anchor="middle" font-family="sans-serif" font-size="12">Data</text>

  <!-- data_transfer -> connection_termination -->
  <line x1="440" y1="275" x2="480" y2="275" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="265" text-anchor="middle" font-family="sans-serif" font-size="12">FIN</text>
</svg>