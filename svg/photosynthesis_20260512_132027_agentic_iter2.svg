<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="320" y="135" width="180" height="70" fill="#f9f9a9" stroke="#000"/>
    <text x="410" y="170" dominant-baseline="middle" text-anchor="middle" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="540" y="135" width="180" height="70" fill="#a9f9a9" stroke="#000"/>
    <text x="630" y="170" dominant-baseline="middle" text-anchor="middle" font-size="14">Chlorophyll</text>
  </g>

  <g id="light_dependent">
    <rect x="540" y="235" width="180" height="70" fill="#a9c9f9" stroke="#000"/>
    <text x="630" y="270" dominant-baseline="middle" text-anchor="middle" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="540" y="335" width="180" height="70" fill="#f9c9a9" stroke="#000"/>
    <text x="630" y="370" dominant-baseline="middle" text-anchor="middle" font-size="14">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="740" y="335" width="180" height="70" fill="#c9f9f9" stroke="#000"/>
    <text x="830" y="370" dominant-baseline="middle" text-anchor="middle" font-size="14">O₂ Release</text>
  </g>

  <g id="atp_nadph">
    <rect x="540" y="435" width="180" height="70" fill="#f9a9c9" stroke="#000"/>
    <text x="630" y="470" dominant-baseline="middle" text-anchor="middle" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="calvin_cycle">
    <rect x="540" y="535" width="180" height="70" fill="#d9a9f9" stroke="#000"/>
    <text x="630" y="570" dominant-baseline="middle" text-anchor="middle" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="740" y="535" width="180" height="70" fill="#a9f9d9" stroke="#000"/>
    <text x="830" y="570" dominant-baseline="middle" text-anchor="middle" font-size="14">Carbon Fixation</text>
  </g>

  <g id="glucose_synthesis">
    <rect x="740" y="635" width="180" height="70" fill="#f9e9a9" stroke="#000"/>
    <text x="830" y="670" dominant-baseline="middle" text-anchor="middle" font-size="14">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <!-- sunlight -> chlorophyll -->
  <line x1="500" y1="170" x2="540" y2="170" stroke="#000" marker-end="url(#arrow)"/>
  <text x="520" y="160" font-size="12" text-anchor="middle">absorbs</text>

  <!-- chlorophyll -> light_dependent -->
  <line x1="630" y1="205" x2="630" y2="235" stroke="#000" marker-end="url(#arrow)"/>
  <text x="640" y="220" font-size="12">excites</text>

  <!-- light_dependent -> water_splitting -->
  <line x1="630" y1="305" x2="630" y2="335" stroke="#000" marker-end="url(#arrow)"/>
  <text x="640" y="320" font-size="12">drives</text>

  <!-- light_dependent -> atp_nadph -->
  <line x1="630" y1="305" x2="630" y2="435" stroke="#000" marker-end="url(#arrow)"/>
  <text x="640" y="370" font-size="12">produces</text>

  <!-- water_splitting -> oxygen_release -->
  <line x1="720" y1="370" x2="740" y2="370" stroke="#000" marker-end="url(#arrow)"/>
  <text x="730" y="360" font-size="12" text-anchor="middle">releases O₂</text>

  <!-- atp_nadph -> calvin_cycle -->
  <line x1="630" y1="505" x2="630" y2="535" stroke="#000" marker-end="url(#arrow)"/>
  <text x="640" y="520" font-size="12">provides ATP/NADPH</text>

  <!-- calvin_cycle -> carbon_fixation -->
  <line x1="720" y1="570" x2="740" y2="570" stroke="#000" marker-end="url(#arrow)"/>
  <text x="730" y="560" font-size="12" text-anchor="middle">includes</text>

  <!-- carbon_fixation -> glucose_synthesis -->
  <line x1="830" y1="605" x2="830" y2="635" stroke="#000" marker-end="url(#arrow)"/>
  <text x="840" y="620" font-size="12">forms glucose</text>

  <!-- calvin_cycle -> glucose_synthesis (curved) -->
  <path d="M630,605 C650,620 810,620 830,635" fill="none" stroke="#000" marker-end="url(#arrow)"/>
  <text x="730" y="620" font-size="12">produces</text>
</svg>