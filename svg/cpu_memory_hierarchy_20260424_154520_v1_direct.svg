<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- CPU Core -->
  <g id="cpu_core">
    <rect x="450" y="30" width="300" height="80" fill="#e0f7fa" stroke="#000"/>
    <text x="600" y="70" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">CPU Core</text>
  </g>

  <!-- Registers -->
  <g id="registers">
    <rect x="450" y="140" width="300" height="80" fill="#b2ebf2" stroke="#000"/>
    <text x="600" y="180" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect x="450" y="250" width="300" height="80" fill="#80deea" stroke="#000"/>
    <text x="600" y="290" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L1 Cache</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect x="450" y="360" width="300" height="80" fill="#4dd0e1" stroke="#000"/>
    <text x="600" y="400" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L2 Cache</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect x="450" y="470" width="300" height="80" fill="#26c6da" stroke="#000"/>
    <text x="600" y="510" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L3 Cache</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect x="450" y="580" width="300" height="80" fill="#00bcd4" stroke="#000"/>
    <text x="600" y="620" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect x="450" y="690" width="300" height="80" fill="#0097a7" stroke="#000"/>
    <text x="600" y="730" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="110" x2="600" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="220" x2="600" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="330" x2="600" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="440" x2="600" y2="470" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="550" x2="600" y2="580" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="660" x2="600" y2="690" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>