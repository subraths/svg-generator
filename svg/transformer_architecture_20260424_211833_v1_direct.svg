<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .block { fill:#f0f0f0; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .arrow { fill:none; stroke:#000; stroke-width:2; marker-end:url(#arrowhead); }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="label" font-size="24">Transformer Architecture</text>

  <!-- Encoder Input -->
  <g id="encoder_input">
    <rect x="100" y="70" width="200" height="60" class="block"/>
    <text x="200" y="100" class="label">Encoder Input</text>
  </g>

  <!-- Encoder Multi‑Head Attention -->
  <g id="encoder_mha">
    <rect x="100" y="160" width="200" height="60" class="block"/>
    <text x="200" y="190" class="label">Multi‑Head Attention</text>
  </g>

  <!-- Encoder Add & Norm 1 -->
  <g id="encoder_addnorm1">
    <rect x="100" y="250" width="200" height="60" class="block"/>
    <text x="200" y="280" class="label">Add &amp; Norm</text>
  </g>

  <!-- Encoder Feed‑Forward -->
  <g id="encoder_ffn">
    <rect x="100" y="340" width="200" height="60" class="block"/>
    <text x="200" y="370" class="label">Feed‑Forward</text>
  </g>

  <!-- Encoder Add & Norm 2 -->
  <g id="encoder_addnorm2">
    <rect x="100" y="430" width="200" height="60" class="block"/>
    <text x="200" y="460" class="label">Add &amp; Norm</text>
  </g>

  <!-- Encoder Output -->
  <g id="encoder_output">
    <rect x="100" y="520" width="200" height="60" class="block"/>
    <text x="200" y="550" class="label">Encoder Output</text>
  </g>

  <!-- Decoder Input -->
  <g id="decoder_input">
    <rect x="800" y="70" width="200" height="60" class="block"/>
    <text x="900" y="100" class="label">Decoder Input</text>
  </g>

  <!-- Decoder Masked MHA -->
  <g id="decoder_mha_masked">
    <rect x="800" y="160" width="200" height="60" class="block"/>
    <text x="900" y="190" class="label">Masked MHA</text>
  </g>

  <!-- Decoder Add & Norm 1 -->
  <g id="decoder_addnorm1">
    <rect x="800" y="250" width="200" height="60" class="block"/>
    <text x="900" y="280" class="label">Add &amp; Norm</text>
  </g>

  <!-- Decoder Encoder‑Decoder Attention -->
  <g id="decoder_encdec_attn">
    <rect x="800" y="340" width="200" height="60" class="block"/>
    <text x="900" y="370" class="label">Enc‑Dec Attention</text>
  </g>

  <!-- Decoder Add & Norm 2 -->
  <g id="decoder_addnorm2">
    <rect x="800" y="430" width="200" height="60" class="block"/>
    <text x="900" y="460" class="label">Add &amp; Norm</text>
  </g>

  <!-- Decoder Feed‑Forward -->
  <g id="decoder_ffn">
    <rect x="800" y="520" width="200" height="60" class="block"/>
    <text x="900" y="550" class="label">Feed‑Forward</text>
  </g>

  <!-- Decoder Add & Norm 3 -->
  <g id="decoder_addnorm3">
    <rect x="800" y="610" width="200" height="60" class="block"/>
    <text x="900" y="640" class="label">Add &amp; Norm</text>
  </g>

  <!-- Decoder Output -->
  <g id="decoder_output">
    <rect x="800" y="700" width="200" height="60" class="block"/>
    <text x="900" y="730" class="label">Decoder Output</text>
  </g>

  <!-- Arrows between Encoder blocks -->
  <path d="M200,130 V160" class="arrow"/>
  <path d="M200,220 V250" class="arrow"/>
  <path d="M200,310 V340" class="arrow"/>
  <path d="M200,400 V430" class="arrow"/>
  <path d="M200,490 V520" class="arrow"/>

  <!-- Arrow from Encoder Output to Decoder Encoder‑Decoder Attention -->
  <path d="M300,550 L750,370" class="arrow"/>

  <!-- Arrows between Decoder blocks -->
  <path d="M900,130 V160" class="arrow"/>
  <path d="M900,220 V250" class="arrow"/>
  <path d="M900,310 V340" class="arrow"/>
  <path d="M900,400 V430" class="arrow"/>
  <path d="M900,490 V520" class="arrow"/>
  <path d="M900,580 V610" class="arrow"/>
  <path d="M900,670 V700" class="arrow"/>

  <!-- Input arrows -->
  <path d="M50,100 H100" class="arrow"/>
  <path d="M1050,730 H1150" class="arrow"/>

  <!-- Labels for external arrows -->
  <text x="30" y="100" class="label" font-size="16" text-anchor="end">Source Text</text>
  <text x="1190" y="730" class="label" font-size="16" text-anchor="start">Generated Text</text>
</svg>