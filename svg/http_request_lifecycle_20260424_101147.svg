<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      rect { fill:#f0f0f0; stroke:#000; stroke-width:2; }
      text { font-family:sans-serif; font-size:16px; fill:#000; }
    </style>
  </defs>

  <!-- Client Browser -->
  <g id="client_browser">
    <rect x="50" y="100" width="150" height="80" rx="5" ry="5"/>
    <text x="125" y="140" text-anchor="middle" dominant-baseline="middle">Client Browser</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect x="250" y="100" width="150" height="80" rx="5" ry="5"/>
    <text x="325" y="140" text-anchor="middle" dominant-baseline="middle">DNS Lookup</text>
  </g>

  <!-- TCP Connection -->
  <g id="tcp_connection">
    <rect x="450" y="100" width="150" height="80" rx="5" ry="5"/>
    <text x="525" y="140" text-anchor="middle" dominant-baseline="middle">TCP Connection</text>
  </g>

  <!-- TLS Handshake -->
  <g id="tls_handshake">
    <rect x="650" y="100" width="150" height="80" rx="5" ry="5"/>
    <text x="725" y="140" text-anchor="middle" dominant-baseline="middle">TLS Handshake</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect x="850" y="100" width="150" height="80" rx="5" ry="5"/>
    <text x="925" y="140" text-anchor="middle" dominant-baseline="middle">HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect x="850" y="300" width="150" height="80" rx="5" ry="5"/>
    <text x="925" y="340" text-anchor="middle" dominant-baseline="middle">Server Processing</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect x="1050" y="300" width="150" height="80" rx="5" ry="5"/>
    <text x="1125" y="340" text-anchor="middle" dominant-baseline="middle">HTTP Response</text>
  </g>

  <!-- Browser Rendering -->
  <g id="browser_rendering">
    <rect x="50" y="300" width="150" height="80" rx="5" ry="5"/>
    <text x="125" y="340" text-anchor="middle" dominant-baseline="middle">Browser Rendering</text>
  </g>

  <!-- Connectors -->
  <line x1="200" y1="140" x2="250" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="450" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="140" x2="650" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="140" x2="850" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="925" y1="180" x2="925" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1000" y1="340" x2="1050" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1050" y1="340" x2="200" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>