<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#000">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="250" y="155" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="340" y="190" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="490" y="155" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="580" y="190" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Chlorophyll (pigment)</text>
  </g>

  <g id="light_dependent">
    <rect x="730" y="155" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="190" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="730" y="255" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="290" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Splitting (H₂O → O₂ + e⁻)</text>
  </g>

  <g id="oxygen_release">
    <rect x="970" y="255" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="1060" y="290" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">O₂ Release</text>
  </g>

  <g id="atp_nadph">
    <rect x="730" y="355" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="390" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="calvin_cycle">
    <rect x="490" y="455" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="580" y="490" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="co2_fixation">
    <rect x="490" y="555" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="580" y="590" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">CO₂ Fixation</text>
  </g>

  <g id="glucose_production">
    <rect x="490" y="655" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="580" y="690" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Production</text>
  </g>

  <g id="stroma">
    <rect x="730" y="555" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="590" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Stroma (site)</text>
  </g>

  <!-- Edges -->
  <path d="M340,155 L400,155" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="370" y="145" text-anchor="middle" font-family="sans-serif" font-size="12">provides energy</text>

  <path d="M580,155 L640,155" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="145" text-anchor="middle" font-family="sans-serif" font-size="12">absorbs light</text>

  <path d="M730,190 L730,220" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="740" y="205