<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold">TCP 3-way Handshake</text>

  <!-- Nodes -->
  <g id="client_syn">
    <rect x="100" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="135" text-anchor="middle" dominant-baseline="middle" font-size="14">Client: SYN</text>
  </g>

  <g id="server_syn_ack">
    <rect x="320" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="410" y="135" text-anchor="middle" dominant-baseline="middle" font-size="14">Server: SYN-ACK</text>
  </g>

  <g id="client_ack">
    <rect x="540" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="630" y="135" text-anchor="middle" dominant-baseline="middle" font-size="14">Client: ACK</text>
  </g>

  <g id="connection_established">
    <rect x="100" y="210" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="190" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Connection Established</text>
  </g>

  <g id="data_transfer">
    <rect x="320" y="210" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="410" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Data Transfer</text>
  </g>

  <g id="connection_termination">
    <rect x="540" y="210" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="630" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Connection Termination</text>
  </g>

  <!-- Edges -->
  <g id="edges">
    <!-- client_syn -> server_syn_ack -->
    <line x1="280" y1="135" x2="320" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="300" y="125" text-anchor="middle" font-size="12">SYN</text>

    <!-- server_syn_ack -> client_ack -->
    <line x1="500" y1="135" x2="540" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="520" y="125" text-anchor="middle" font-size="12">SYN-ACK</text>

    <!-- client_ack -> connection_established -->
    <line x1="630" y1="170" x2="190" y2="210" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="410" y="190" text-anchor="middle" font-size="12">ACK</text>

    <!-- connection_established -> data_transfer -->
    <line x1="280" y1="245" x2="320" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="300" y="235" text-anchor="middle" font-size="12">Data</text>

    <!-- data_transfer -> connection_termination -->
    <line x1="500" y1="245" x2="540" y2="245" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="520" y="235" text-anchor="middle" font-size="12">FIN</text>
  </g>
</svg>