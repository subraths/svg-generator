<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- User Application -->
  <g id="user_application">
    <rect x="100" y="100" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="200" y="140" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">User Application</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect x="400" y="100" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="500" y="140" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Recursive Resolver</text>
  </g>

  <!-- Root DNS Server -->
  <g id="root_dns_server">
    <rect x="700" y="100" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="800" y="140" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Root DNS Server</text>
  </g>

  <!-- TLD DNS Server -->
  <g id="tld_dns_server">
    <rect x="700" y="300" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="800" y="340" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">TLD DNS Server</text>
  </g>

  <!-- Authoritative DNS Server -->
  <g id="authoritative_dns_server">
    <rect x="700" y="500" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="800" y="540" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Authoritative DNS Server</text>
  </g>

  <!-- Application Response -->
  <g id="application_response">
    <rect x="100" y="600" width="200" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="200" y="640" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Response to Application</text>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="140" x2="400" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="140" x2="700" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="180" x2="800" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="380" x2="800" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="540" x2="400" y2="540" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="180" x2="200" y2="640" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>