<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold">Software Development Lifecycle</text>

  <!-- Nodes -->
  <g id="requirements">
    <rect x="520" y="40" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="80" text-anchor="middle" dominant-baseline="middle" font-size="18">Requirements</text>
  </g>

  <g id="design">
    <rect x="520" y="140" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="180" text-anchor="middle" dominant-baseline="middle" font-size="18">Design</text>
  </g>

  <g id="implementation">
    <rect x="520" y="240" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="280" text-anchor="middle" dominant-baseline="middle" font-size="18">Implementation</text>
  </g>

  <g id="testing">
    <rect x="520" y="340" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="380" text-anchor="middle" dominant-baseline="middle" font-size="18">Testing</text>
  </g>

  <g id="deployment">
    <rect x="520" y="440" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="480" text-anchor="middle" dominant-baseline="middle" font-size="18">Deployment</text>
  </g>

  <g id="maintenance">
    <rect x="520" y="540" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="610" y="580" text-anchor="middle" dominant-baseline="middle" font-size="18">Maintenance</text>
  </g>

  <!-- Edges -->
  <line x1="610" y1="110" x2="610" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="125" text-anchor="middle" dominant-baseline="middle" font-size="12">next</text>

  <line x1="610" y1="210" x2="610" y2="240" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="225" text-anchor="middle" dominant-baseline="middle" font-size="12">next</text>

  <line x1="610" y1="310" x2="610" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="325" text-anchor="middle" dominant-baseline="middle" font-size="12">next</text>

  <line x1="610" y1="410" x2="610" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="425" text-anchor="middle" dominant-baseline="middle" font-size="12">next</text>

  <line x1="610" y1="510" x2="610" y2="540" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="525" text-anchor="middle" dominant-baseline="middle" font-size="12">next</text>
</svg>