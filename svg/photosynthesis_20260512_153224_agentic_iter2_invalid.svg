<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="10" refY="0"
            markerWidth="6" markerHeight="6" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,-5L10,0L0,5" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#000">
    Photosynthesis Process
  </text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="110" y="175" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="200" y="210" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="330" y="175" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="420" y="210" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Chlorophyll</text>
  </g>

  <g id="light_dependent">
    <rect x="550" y="175" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="640" y="210" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="550" y="275" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="640" y="310" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="750" y="275" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="840" y="310" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Oxygen Release</text>
  </g>

  <g id="atp_nadph">
    <rect x="950" y="275" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="1040" y="310" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">ATP &amp; NADPH Production</text>
  </g>

  <g id="light_independent">
    <rect x="550" y="395" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="640" y="430" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Light‑independent Reactions (Calvin Cycle)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="550" y="495" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="640" y="530" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Carbon Fixation</text>
  </g>

  <g id="glucose_synthesis">
    <rect x="550" y="595" width="180" height="70" fill="#e0f7fa" stroke="#000" stroke-width="1"/>
    <text x="640" y="630" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <path d="M290,210 H330" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M510,210 H550" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640,245 V275" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640,245 V275 H840" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>