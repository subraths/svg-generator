<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="40" y="100" width="180" height="70" fill="#f9f9f9" stroke="#000"/>
    <text x="130" y="135" text-anchor="middle" dominant-baseline="middle" font-size="14">Sunlight</text>
  </g>

  <g id="water">
    <rect x="40" y="200" width="180" height="70" fill="#f9f9f9" stroke="#000"/>
    <text x="130" y="235" text-anchor="middle" dominant-baseline="middle" font-size="14">Water (H₂O)</text>
  </g>

  <g id="carbon_dioxide">
    <rect x="40" y="300" width="180" height="70" fill="#f9f9f9" stroke="#000"/>
    <text x="130" y="335" text-anchor="middle" dominant-baseline="middle" font-size="14">Carbon Dioxide (CO₂)</text>
  </g>

  <g id="light_dependent">
    <rect x="260" y="150" width="180" height="70" fill="#f0f8ff" stroke="#000"/>
    <text x="350" y="185" text-anchor="middle" dominant-baseline="middle" font-size="14">Light‑Dependent Reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="480" y="250" width="180" height="70" fill="#f0f8ff" stroke="#000"/>
    <text x="570" y="285" text-anchor="middle" dominant-baseline="middle" font-size="14">Calvin Cycle (Light‑Independent)</text>
  </g>

  <g id="glucose">
    <rect x="700" y="250" width="180" height="70" fill="#e6ffe6" stroke="#000"/>
    <text x="790" y="285" text-anchor="middle" dominant-baseline="middle" font-size="14">Glucose (C₆H₁₂O₆)</text>
  </g>

  <g id="oxygen">
    <rect x="700" y="150" width="180" height="70" fill="#e6ffe6" stroke="#000"/>
    <text x="790" y="185" text-anchor="middle" dominant-baseline="middle" font-size="14">Oxygen (O₂)</text>
  </g>

  <!-- Edges -->
  <line x1="220" y1="135" x2="260" y2="185" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="240" y="155" text-anchor="middle" font-size="12">sunlight</text>

  <line x1="220" y1="235" x2="260" y2="185" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="240" y="210" text-anchor="middle" font-size="12">H₂O</text>

  <line x1="440" y1="185" x2="700" y2="185" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="570" y="175" text-anchor="middle" font-size="12">O₂</text>

  <line x1="440" y1="185" x2="480" y2="285" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="460" y="235" text-anchor="middle" font-size="12">ATP/NADPH</text>

  <line x1="220" y1="335" x2="480" y2="285" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="350" y="310" text-anchor="middle" font-size="12">CO₂</text>

  <line x1="660" y1="285" x2="700" y2="285" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="680" y="275" text-anchor="middle" font-size="12">C₆H₁₂O₆</text>
</svg>