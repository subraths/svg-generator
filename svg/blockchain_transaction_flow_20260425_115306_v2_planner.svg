<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="20" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#000">Blockchain Transaction Flow</text>

  <!-- Nodes -->
  <g id="user_initiates">
    <rect x="100" y="40" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="80" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      User Initiates Transaction
    </text>
  </g>

  <g id="broadcast">
    <rect x="100" y="140" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="180" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      Transaction Broadcast
    </text>
  </g>

  <g id="validation">
    <rect x="100" y="240" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="280" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      Transaction Validation
    </text>
  </g>

  <g id="consensus">
    <rect x="100" y="340" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="380" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      Mining / Consensus
    </text>
  </g>

  <g id="block_added">
    <rect x="100" y="440" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="480" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      Block Added to Chain
    </text>
  </g>

  <g id="confirmation">
    <rect x="100" y="540" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="580" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">
      Confirmation to User
    </text>
  </g>

  <!-- Edges -->
  <line x1="190" y1="110" x2="190" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="210" x2="190" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="310" x2="190" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="410" x2="190" y2="440" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="510" x2="190" y2="540" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>