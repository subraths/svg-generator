<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Registers -->
  <g id="registers">
    <rect x="450" y="50" width="300" height="80" fill="#e0f7fa" stroke="#000" stroke-width="2"/>
    <text x="600" y="90" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect x="450" y="170" width="300" height="80" fill="#b2ebf2" stroke="#000" stroke-width="2"/>
    <text x="600" y="210" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L1 Cache</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect x="450" y="290" width="300" height="80" fill="#80deea" stroke="#000" stroke-width="2"/>
    <text x="600" y="330" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L2 Cache</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect x="450" y="410" width="300" height="80" fill="#4dd0e1" stroke="#000" stroke-width="2"/>
    <text x="600" y="450" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L3 Cache</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect x="450" y="530" width="300" height="80" fill="#26c6da" stroke="#000" stroke-width="2"/>
    <text x="600" y="570" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect x="450" y="650" width="300" height="80" fill="#00bcd4" stroke="#000" stroke-width="2"/>
    <text x="600" y="690" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="130" x2="600" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="370" x2="600" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="610" x2="600" y2="650" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>