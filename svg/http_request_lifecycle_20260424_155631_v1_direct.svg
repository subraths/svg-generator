<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect x="450" y="30" width="300" height="60" fill="#cce5ff" stroke="#000"/>
    <text x="600" y="60" font-size="18" text-anchor="middle" dominant-baseline="middle">Browser (Client)</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect x="450" y="130" width="300" height="60" fill="#e2f0d9" stroke="#000"/>
    <text x="600" y="160" font-size="18" text-anchor="middle" dominant-baseline="middle">DNS Lookup</text>
  </g>

  <!-- TCP Handshake -->
  <g id="tcp_handshake">
    <rect x="450" y="230" width="300" height="60" fill="#fff3cd" stroke="#000"/>
    <text x="600" y="260" font-size="18" text-anchor="middle" dominant-baseline="middle">TCP Handshake</text>
  </g>

  <!-- TLS Handshake -->
  <g id="tls_handshake">
    <rect x="450" y="330" width="300" height="60" fill="#f8d7da" stroke="#000"/>
    <text x="600" y="360" font-size="18" text-anchor="middle" dominant-baseline="middle">TLS Handshake (optional)</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect x="450" y="430" width="300" height="60" fill="#d1ecf1" stroke="#000"/>
    <text x="600" y="460" font-size="18" text-anchor="middle" dominant-baseline="middle">Send HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect x="450" y="530" width="300" height="60" fill="#ffe5b4" stroke="#000"/>
    <text x="600" y="560" font-size="18" text-anchor="middle" dominant-baseline="middle">Server Processes Request</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect x="450" y="630" width="300" height="60" fill="#d4edda" stroke="#000"/>
    <text x="600" y="660" font-size="18" text-anchor="middle" dominant-baseline="middle">Send HTTP Response</text>
  </g>

  <!-- Render -->
  <g id="render">
    <rect x="450" y="730" width="300" height="60" fill="#f5c6cb" stroke="#000"/>
    <text x="600" y="760" font-size="18" text-anchor="middle" dominant-baseline="middle">Browser Renders Page</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="90" x2="600" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="190" x2="600" y2="230" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="290" x2="600" y2="330" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="390" x2="600" y2="430" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="590" x2="600" y2="630" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="690" x2="600" y2="730" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>