<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node { fill:#f0f8ff; stroke:#000; stroke-width:2; }
      .node-text { font-family:Arial,Helvetica,sans-serif; font-size:14px; pointer-events:none; }
      .edge { stroke:#000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
      .edge-label { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#000; background:#fff; }
      .title { font-family:Arial,Helvetica,sans-serif; font-size:24px; font-weight:bold; text-anchor:middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="40" class="title">TCP 3-Way Handshake</text>

  <!-- Nodes -->
  <g id="client_syn">
    <rect x="610" y="105" width="180" height="70" class="node"/>
    <text x="700" y="145" text-anchor="middle" dominant-baseline="middle" class="node-text">Client: SEND SYN</text>
  </g>

  <g id="server_receive_syn">
    <rect x="610" y="205" width="180" height="70" class="node"/>
    <text x="700" y="245" text-anchor="middle" dominant-baseline="middle" class="node-text">Server: RECEIVE SYN</text>
  </g>

  <g id="server_send_synack">
    <rect x="610" y="305" width="180" height="70" class="node"/>
    <text x="700" y="345" text-anchor="middle" dominant-baseline="middle" class="node-text">Server: SEND SYN‑ACK</text>
  </g>

  <g id="client_receive_synack">
    <rect x="610" y="405" width="180" height="70" class="node"/>
    <text x="700" y="445" text-anchor="middle" dominant-baseline="middle" class="node-text">Client: RECEIVE SYN‑ACK</text>
  </g>

  <g id="client_send_ack">
    <rect x="610" y="505" width="180" height="70" class="node"/>
    <text x="700" y="545" text-anchor="middle" dominant-baseline="middle" class="node-text">Client: SEND ACK</text>
  </g>

  <g id="server_receive_ack">
    <rect x="610" y="605" width="180" height="70" class="node"/>
    <text x="700" y="645" text-anchor="middle" dominant-baseline="middle" class="node-text">Server: RECEIVE ACK</text>
  </g>

  <g id="connection_established">
    <rect x="610" y="705" width="180" height="70" class="node"/>
    <text x="700" y="745" text-anchor="middle" dominant-baseline="middle" class="node-text">Connection ESTABLISHED</text>
  </g>

  <!-- Edges -->
  <g id="edge_client_syn_to_server_receive_syn" class="edge">
    <line x1="700" y1="175" x2="700" y2="205" class="edge"/>
    <text x="710" y="190" class="edge-label">SYN</text>
  </g>

  <g id="edge_server_receive_syn_to_server_send_synack" class="edge">
    <line x1="700" y1="275" x2="700" y2="305" class="edge"/>
    <text x="710" y="290" class="edge-label">process</text>
  </g>

  <g id="edge_server_send_synack_to_client_receive_synack" class="edge">
    <line x1="700" y1="375" x2="700" y2="405" class="edge"/>
    <text x="710" y="390" class="edge-label">SYN‑ACK</text>
  </g>

  <g id="edge_client_receive_synack_to_client_send_ack" class="edge">
    <line x1="700" y1="475" x2="700" y2="505" class="edge"/>
    <text x="710" y="490" class="edge-label">process</text>
  </g>

  <g id="edge_client_send_ack_to_server_receive_ack" class="edge">
    <line x1="700" y1="575" x2="700" y2="605" class="edge"/>
    <text x="710" y="590" class="edge-label">ACK</text>
  </g>

  <g id="edge_server_receive_ack_to_connection_established" class="edge">
    <line x1="700" y1="675" x2="700" y2="705" class="edge"/>
    <text x="710" y="690" class="edge-label">establish</text>
  </g>
</svg>