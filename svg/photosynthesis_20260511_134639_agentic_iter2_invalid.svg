<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node rect { fill:#e0f7fa; stroke:#000; stroke-width:2; }
      .node text { font-family:sans-serif; font-size:14px; pointer-events:none; }
      .edge path { fill:none; stroke:#000; stroke-width:2; marker-end:url(#arrowhead); }
      .edge text { font-family:sans-serif; font-size:12px; fill:#000; pointer-events:none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight" class="node">
    <rect x="20" y="20" width="180" height="70" rx="5" ry="5"/>
    <text x="110" y="55" dominant-baseline="middle" text-anchor="middle">Sunlight</text>
  </g>

  <g id="chlorophyll" class="node">
    <rect x="240" y="20" width="180" height="70" rx="5" ry="5"/>
    <text x="330" y="55" dominant-baseline="middle" text-anchor="middle">Chlorophyll</text>
  </g>

  <g id="water_splitting" class="node">
    <rect x="440" y="20" width="180" height="70" rx="5" ry="5"/>
    <text x="530" y="55" dominant-baseline="middle" text-anchor="middle">Water Splitting</text>
  </g>

  <g id="oxygen_release" class="node">
    <rect x="660" y="20" width="180" height="70" rx="5" ry="5"/>
    <text x="750" y="55" dominant-baseline="middle" text-anchor="middle">Oxygen Release</text>
  </g>

  <g id="light_dependent" class="node">
    <rect x="20" y="120" width="180" height="70" rx="5" ry="5"/>
    <text x="110" y="155" dominant-baseline="middle" text-anchor="middle">Light‑dependent Reactions</text>
  </g>

  <g id="atp_nadph_production" class="node">
    <rect x="240" y="120" width="180" height="70" rx="5" ry="5"/>
    <text x="330" y="155" dominant-baseline="middle" text-anchor="middle">ATP &amp; NADPH Production</text>
  </g>

  <g id="calvin_cycle" class="node">
    <rect x="20" y="240" width="180" height="70" rx="5" ry="5"/>
    <text x="110" y="275" dominant-baseline="middle" text-anchor="middle">Calvin Cycle</text>
  </g>

  <g id="carbon_dioxide_fixation" class="node">
    <rect x="240" y="240" width="180" height="70" rx="5" ry="5"/>
    <text x="330" y="275" dominant-baseline="middle" text-anchor="middle">CO₂ Fixation</text>
  </g>

  <g id="glucose_synthesis" class="node">
    <rect x="460" y="240" width="180" height="70" rx="5" ry="5"/>
    <text x="550" y="275" dominant-baseline="middle" text-anchor="middle">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <g class="edge">
    <path d="M200,55 L240,55"/>
    <text x="220" y="45" text-anchor="middle">absorbs</text>
  </g>

  <g class="edge">
    <path d="M330,90 L330,120"/>
    <text x="340" y="105" text-anchor="start">excites</text>
  </g>

  <g class="edge">
    <path d="M200,155 L240,155"/>
    <text x="220" y="145" text-anchor="middle">produces</text>
  </g>

  <g class="edge">
    <path d="M200,155 C200,120 440,120 440,55"/>
    <text x="320" y="115" text-anchor="middle">splits H₂O</text>
  </g>

  <g class="edge">
    <path d="M620,55 L660,55"/>
    <text x="640" y="45" text-anchor="middle">releases O₂</text>
  </g>

  <g class="edge">
    <path d="M330,190 L330,240"/>
    <text x="340" y="215" text-anchor="start">provides energy</text>
  </g>

  <g class="edge">
    <path d="M200,275 L240,275"/>
    <text x="220" y="265" text-anchor="middle">fixes CO₂</text>
  </