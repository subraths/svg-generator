<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="330" y="200" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="420" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="530" y="200" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="620" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Chlorophyll</text>
  </g>

  <g id="light_dependent">
    <rect x="530" y="300" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="620" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="730" y="300" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Splitting (H₂O → O₂ + e⁻)</text>
  </g>

  <g id="atp_nadph">
    <rect x="730" y="390" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="730" y="480" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="820" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">O₂ Release</text>
  </g>

  <g id="calvin_cycle">
    <rect x="530" y="390" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="620" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="530" y="480" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="620" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">CO₂ Fixation</text>
  </g>

  <g id="glucose">
    <rect x="530" y="570" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="620" y="605" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <!-- Sunlight → Chlorophyll -->
  <line x1="510" y1="235" x2="530" y2="235" stroke="black" marker-end="url(#arrow)"/>
  <text x="520" y="225" text-anchor="middle" font-family="sans-serif" font-size="12">absorbs</text>

  <!-- Chlorophyll → Light‑dependent Reactions -->
  <line x1="620" y1="270" x2="620" y2="300" stroke="black" marker-end="url(#arrow)"/>
  <text x="630"