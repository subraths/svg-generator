<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect x="450" y="30" width="300" height="70" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="600" y="65" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Client (Browser)</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect x="450" y="130" width="300" height="70" fill="#d4edda" stroke="#333" stroke-width="2"/>
    <text x="600" y="165" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">DNS Lookup</text>
  </g>

  <!-- TCP Handshake -->
  <g id="tcp_handshake">
    <rect x="450" y="230" width="300" height="70" fill="#fff3cd" stroke="#333" stroke-width="2"/>
    <text x="600" y="265" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">TCP Handshake (3‑way)</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect x="450" y="330" width="300" height="70" fill="#f8d7da" stroke="#333" stroke-width="2"/>
    <text x="600" y="365" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Send HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect x="450" y="430" width="300" height="70" fill="#e2e3e5" stroke="#333" stroke-width="2"/>
    <text x="600" y="465" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Server Processes Request</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect x="450" y="530" width="300" height="70" fill="#f5c6cb" stroke="#333" stroke-width="2"/>
    <text x="600" y="565" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Send HTTP Response</text>
  </g>

  <!-- Rendering -->
  <g id="rendering">
    <rect x="450" y="630" width="300" height="70" fill="#ffeeba" stroke="#333" stroke-width="2"/>
    <text x="600" y="665" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Browser Renders Content</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="100" x2="600" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="200" x2="600" y2="230" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="300" x2="600" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="400" x2="600" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="500" x2="600" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="600" x2="600" y2="630" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>