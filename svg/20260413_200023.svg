<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Input Embedding -->
  <g id="input_embedding">
    <rect x="50" y="100" width="150" height="80" fill="#e0e0e0" stroke="black"/>
    <text x="125" y="145" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Input Embedding</text>
  </g>

  <!-- Positional Encoding -->
  <g id="positional_encoding">
    <rect x="250" y="100" width="150" height="80" fill="#e0e0e0" stroke="black"/>
    <text x="325" y="145" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Positional Encoding</text>
  </g>

  <!-- Encoder Self‑Attention -->
  <g id="encoder_self_attention">
    <rect x="450" y="80" width="180" height="100" fill="#f0f8ff" stroke="black"/>
    <text x="540" y="130" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Encoder<br/>Self‑Attention</text>
  </g>

  <!-- Encoder Feed‑Forward -->
  <g id="encoder_feed_forward">
    <rect x="660" y="80" width="180" height="100" fill="#f0f8ff" stroke="black"/>
    <text x="750" y="130" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Encoder<br/>Feed‑Forward</text>
  </g>

  <!-- Decoder Self‑Attention -->
  <g id="decoder_self_attention">
    <rect x="450" y="260" width="180" height="100" fill="#ffe4e1" stroke="black"/>
    <text x="540" y="310" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Decoder<br/>Self‑Attention</text>
  </g>

  <!-- Decoder Encoder‑Decoder Attention -->
  <g id="decoder_enc_dec_attention">
    <rect x="660" y="260" width="180" height="100" fill="#ffe4e1" stroke="black"/>
    <text x="750" y="310" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Encoder‑Decoder<br/>Attention</text>
  </g>

  <!-- Output Layer -->
  <g id="output_layer">
    <rect x="880" y="260" width="120" height="80" fill="#d3ffd3" stroke="black"/>
    <text x="940" y="300" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Output<br/>Linear + Softmax</text>
  </g>

  <!-- Connectors -->
  <!-- Input → Positional -->
  <line x1="200" y1="140" x2="250" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Positional → Encoder Self‑Attention -->
  <line x1="400" y1="140" x2="450" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Encoder Self‑Attention → Encoder Feed‑Forward -->
  <line x1="630" y1="140" x2="660" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Encoder Feed‑Forward → Decoder Encoder‑Decoder Attention (diagonal) -->
  <line x1="630" y1="140" x2="660" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Decoder Self‑Attention → Decoder Encoder‑Decoder Attention -->
  <line x1="630" y1="310" x2="660" y2="310" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Decoder Encoder‑Decoder Attention → Output Layer -->
  <line x1="840" y1="310" x2="880" y2="310" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>