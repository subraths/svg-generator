<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .block { fill:#f0f8ff; stroke:#000; stroke-width:1.5; }
      .text { font-family:sans-serif; font-size:16px; dominant-baseline:middle; text-anchor:middle; }
    </style>
  </defs>

  <!-- Input Embedding -->
  <g id="input_embedding">
    <rect class="block" x="50" y="300" width="150" height="80" rx="8"/>
    <text class="text" x="125" y="340">Input Embedding</text>
  </g>

  <!-- Positional Encoding -->
  <g id="positional_encoding">
    <rect class="block" x="250" y="300" width="150" height="80" rx="8"/>
    <text class="text" x="325" y="340">Positional Encoding</text>
  </g>

  <!-- Encoder Stack -->
  <g id="encoder">
    <rect class="block" x="450" y="150" width="200" height="300" rx="8"/>
    <text class="text" x="550" y="170">Encoder Stack</text>
    <text class="text" x="550" y="200">- Multi‑Head Self‑Attention</text>
    <text class="text" x="550" y="230">- Add &amp; Norm</text>
    <text class="text" x="550" y="260">- Feed‑Forward</text>
    <text class="text" x="550" y="290">- Add &amp; Norm</text>
    <text class="text" x="550" y="320">(... repeated N times)</text>
  </g>

  <!-- Decoder Stack -->
  <g id="decoder">
    <rect class="block" x="700" y="150" width="200" height="300" rx="8"/>
    <text class="text" x="800" y="170">Decoder Stack</text>
    <text class="text" x="800" y="200">- Masked Multi‑Head Self‑Attention</text>
    <text class="text" x="800" y="230">- Add &amp; Norm</text>
    <text class="text" x="800" y="260">- Encoder‑Decoder Attention</text>
    <text class="text" x="800" y="290">- Add &amp; Norm</text>
    <text class="text" x="800" y="320">- Feed‑Forward</text>
    <text class="text" x="800" y="350">- Add &amp; Norm</text>
    <text class="text" x="800" y="380">(... repeated M times)</text>
  </g>

  <!-- Output Projection -->
  <g id="output_projection">
    <rect class="block" x="920" y="300" width="60" height="80" rx="8"/>
    <text class="text" x="950" y="340">Linear + Softmax</text>
  </g>

  <!-- Loss / Prediction -->
  <g id="loss">
    <rect class="block" x="920" y="420" width="80" height="60" rx="8"/>
    <text class="text" x="960" y="450">Loss / Prediction</text>
  </g>

  <!-- Connectors -->
  <line x1="200" y1="340" x2="250" y2="340" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="340" x2="450" y2="300" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="300" x2="700" y2="300" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="340" x2="920" y2="340" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="950" y1="380" x2="950" y2="420" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>