<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#000">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="sunlight_absorption">
    <rect x="20" y="20" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="110" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Sunlight absorption</text>
  </g>

  <g id="chlorophyll">
    <rect x="240" y="20" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="330" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Chlorophyll (pigment)</text>
  </g>

  <g id="water_splitting">
    <rect x="20" y="120" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="110" y="155" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Water splitting (photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="240" y="120" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="330" y="155" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Oxygen release</text>
  </g>

  <g id="atp_nadph_production">
    <rect x="20" y="240" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="110" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">ATP &amp; NADPH production</text>
  </g>

  <g id="light_dependent_reactions">
    <rect x="240" y="240" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="330" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Light‑dependent reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="20" y="360" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="110" y="395" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Calvin Cycle (light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="240" y="360" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="330" y="395" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">CO₂ fixation</text>
  </g>

  <g id="glucose_production">
    <rect x="20" y="480" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="110" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Glucose synthesis</text>
  </g>

  <g id="starch_storage">
    <rect x="240" y="480" width="180" height="70" fill="#fff" stroke="#000"/>
    <text x="330" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Starch storage</text>
  </g>

  <!-- Edges -->
  <line x1="200" y1="55" x2="240" y2="55" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="90" x2="330" y2="240" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="275" x2="200" y2="275" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="240" x2="330" y2="190" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="310" x2="110" y2="360" stroke="#000" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="395" x