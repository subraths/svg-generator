<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .block { stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Input Embedding -->
  <g id="input_embedding">
    <rect x="50" y="50" width="200" height="50" fill="#cce5ff" class="block"/>
    <text x="150" y="75" class="label">Input Embedding</text>
  </g>

  <!-- Positional Encoding (Encoder) -->
  <g id="positional_encoding_encoder">
    <rect x="50" y="130" width="200" height="50" fill="#d4edda" class="block"/>
    <text x="150" y="155" class="label">Positional Encoding</text>
  </g>

  <!-- Encoder Stack -->
  <g id="encoder_stack">
    <rect x="50" y="210" width="200" height="200" fill="#f8f9fa" class="block"/>
    <text x="150" y="310" class="label">Encoder Stack</text>
    <!-- Sub‑components (optional visual hints) -->
    <text x="150" y="240" class="label" font-size="14">Multi‑Head Self‑Attention</text>
    <text x="150" y="270" class="label" font-size="14">Add &amp; Norm</text>
    <text x="150" y="300" class="label" font-size="14">Feed‑Forward</text>
    <text x="150" y="330" class="label" font-size="14">Add &amp; Norm</text>
  </g>

  <!-- Decoder Input Embedding -->
  <g id="decoder_input_embedding">
    <rect x="550" y="50" width="200" height="50" fill="#cce5ff" class="block"/>
    <text x="650" y="75" class="label">Decoder Input Embedding</text>
  </g>

  <!-- Positional Encoding (Decoder) -->
  <g id="positional_encoding_decoder">
    <rect x="550" y="130" width="200" height="50" fill="#d4edda" class="block"/>
    <text x="650" y="155" class="label">Positional Encoding</text>
  </g>

  <!-- Decoder Stack -->
  <g id="decoder_stack">
    <rect x="550" y="210" width="200" height="250" fill="#f8f9fa" class="block"/>
    <text x="650" y="335" class="label">Decoder Stack</text>
    <text x="650" y="240" class="label" font-size="14">Masked Self‑Attention</text>
    <text x="650" y="270" class="label" font-size="14">Add &amp; Norm</text>
    <text x="650" y="300" class="label" font-size="14">Encoder‑Decoder Attention</text>
    <text x="650" y="330" class="label" font-size="14">Add &amp; Norm</text>
    <text x="650" y="360" class="label" font-size="14">Feed‑Forward</text>
    <text x="650" y="390" class="label" font-size="14">Add &amp; Norm</text>
  </g>

  <!-- Output Projection -->
  <g id="output_projection">
    <rect x="550" y="480" width="200" height="50" fill="#fff3cd" class="block"/>
    <text x="650" y="505" class="label">Output Linear + Softmax</text>
  </g>

  <!-- Arrows / Flow -->
  <!-- Input Embedding → Positional Encoding (Encoder) -->
  <line x1="150" y1="100" x2="150" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Positional Encoding → Encoder Stack -->
  <line x1="150" y1="180" x2="150" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Encoder Stack → Decoder Stack (Encoder‑Decoder Attention) -->
  <line x1="250" y1="310" x2="550" y2="310" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder Input Embedding → Positional Encoding (Decoder) -->
  <line x1="650" y1="100" x2="650" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Positional Encoding → Decoder Stack -->
  <line x1="650" y1="180" x2="650" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder Stack → Output Projection -->
  <line x1="650" y1="460" x2="650" y2="480" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>