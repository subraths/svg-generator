<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 -5 10 10" refX="5" refY="0"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,-5L10,0L0,5Z" fill="black"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="330" y="200" width="180" height="70" fill="#f9f9a9" stroke="#333"/>
    <text x="420" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="530" y="200" width="180" height="70" fill="#a9f9c9" stroke="#333"/>
    <text x="620" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Chlorophyll</text>
  </g>

  <g id="light_dependent">
    <rect x="530" y="300" width="180" height="70" fill="#a9c9f9" stroke="#333"/>
    <text x="620" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="730" y="300" width="180" height="70" fill="#f9c9a9" stroke="#333"/>
    <text x="820" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Splitting (H₂O → O₂ + e⁻)</text>
  </g>

  <g id="atp_nadph">
    <rect x="730" y="390" width="180" height="70" fill="#c9a9f9" stroke="#333"/>
    <text x="820" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="730" y="480" width="180" height="70" fill="#f9a9c9" stroke="#333"/>
    <text x="820" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">O₂ Release</text>
  </g>

  <g id="calvin_cycle">
    <rect x="530" y="390" width="180" height="70" fill="#a9f9f9" stroke="#333"/>
    <text x="620" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="530" y="480" width="180" height="70" fill="#f9f9a9" stroke="#333"/>
    <text x="620" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">CO₂ Fixation</text>
  </g>

  <g id="glucose">
    <rect x="530" y="570" width="180" height="70" fill="#a9c9f9" stroke="#333"/>
    <text x="620" y="605" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <path d="M510,235 L530,235" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,270 L620,300" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,335 L730,335" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,335 L730,425" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,370 L820,480" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M730,425 L710,425" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,460 L620,480" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,550 L620,570" stroke="#000" fill="none" marker-end="url(#arrow)"/>
</svg>