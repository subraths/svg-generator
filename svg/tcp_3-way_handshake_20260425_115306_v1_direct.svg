<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect class="box" x="100" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="200" y="360" text-anchor="middle">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect class="box" x="800" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="900" y="360" text-anchor="middle">Server</text>
  </g>

  <!-- SYN arrow -->
  <g id="syn_arrow">
    <line class="arrow" x1="300" y1="350" x2="800" y2="350" marker-end="url(#arrowhead)"/>
    <text class="label" x="550" y="330" text-anchor="middle">SYN</text>
  </g>

  <!-- SYN-ACK arrow -->
  <g id="synack_arrow">
    <line class="arrow" x1="1000" y1="350" x2="300" y2="350" marker-end="url(#arrowhead)"/>
    <text class="label" x="550" y="380" text-anchor="middle">SYN‑ACK</text>
  </g>

  <!-- ACK arrow -->
  <g id="ack_arrow">
    <line class="arrow" x1="300" y1="400" x2="800" y2="400" marker-end="url(#arrowhead)"/>
    <text class="label" x="550" y="380" text-anchor="middle">ACK</text>
  </g>

  <!-- Connection established label -->
  <g id="connection_state">
    <text class="label" x="900" y="500" text-anchor="middle">Connection Established</text>
  </g>
</svg>