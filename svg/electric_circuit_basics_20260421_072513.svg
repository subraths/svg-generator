<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Electric Circuit Basics</text>

  <!-- Nodes -->
  <g id="power_source">
    <rect x="100" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="190" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Power Source</text>
  </g>

  <g id="conductors">
    <rect x="320" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="410" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Conductors</text>
  </g>

  <g id="switch">
    <rect x="540" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="630" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Switch</text>
  </g>

  <g id="load">
    <rect x="760" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="850" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Load (Resistor)</text>
  </g>

  <g id="series_circuit">
    <rect x="200" y="240" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="290" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Series Circuit</text>
  </g>

  <g id="parallel_circuit">
    <rect x="560" y="240" width="180" height="70" fill="#fff3e0" stroke="#000"/>
    <text x="650" y="275" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Parallel Circuit</text>
  </g>

  <g id="ohms_law">
    <rect x="380" y="380" width="180" height="70" fill="#e8f5e9" stroke="#000"/>
    <text x="470" y="415" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Ohm's Law</text>
  </g>

  <!-- Edges -->
  <line x1="280" y1="135" x2="320" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="135" x2="540" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="135" x2="760" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Load to Series Circuit -->
  <path d="M850,170 L850,240 L380,240" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Load to Parallel Circuit -->
  <path d="M850,170 L850,240 L650,240" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Series Circuit to Ohm's Law -->
  <path d="M290,310 L290,380 L470,380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Parallel Circuit to Ohm's Law -->
  <path d="M650,310 L650,380 L470,380" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>