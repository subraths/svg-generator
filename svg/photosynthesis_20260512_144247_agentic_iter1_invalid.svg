<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" font-size="36" font-weight="bold" fill="#000">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="230" y="205" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="320" y="240" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="430" y="205" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="520" y="240" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Chlorophyll</text>
  </g>

  <g id="light_dependent">
    <rect x="630" y="205" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="720" y="240" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="630" y="295" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="720" y="330" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Water Splitting (H₂O → O₂ + e⁻)</text>
  </g>

  <g id="atp_nadph">
    <rect x="830" y="295" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="920" y="330" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">ATP &amp; NADPH Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="630" y="385" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="720" y="420" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">O₂ Release</text>
  </g>

  <g id="calvin_cycle">
    <rect x="830" y="385" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="920" y="420" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="830" y="475" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="920" y="510" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">CO₂ Fixation</text>
  </g>

  <g id="glucose">
    <rect x="830" y="565" width="180" height="70" fill="#f0f8ff" stroke="#000" stroke-width="2"/>
    <text x="920" y="600" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000">Glucose Synthesis</text>
  </g>

  <!-- Edges -->
  <!-- sunlight -> chlorophyll -->
  <line x1="410" y1="240" x2="430" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="235" text-anchor="middle" font-size="14" fill="#000">absorbs</text>

  <!-- chlorophyll -> light_dependent -->
  <line x1="610" y1="240" x2="630" y2="240" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="235" text-anchor="middle" font-size="14" fill="#000">excites</text>

  <!-- light_dependent -> water_splitting -->
  <line x1="720" y1="275" x2="720" y2="295" stroke="#000" stroke-width="2"