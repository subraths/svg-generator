<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
    <style>
      .node { fill:#ffffff; stroke:#000000; stroke-width:2; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:14px; text-anchor:middle; dominant-baseline:middle; }
      .edge { fill:none; stroke:#000000; stroke-width:2; }
      .edgelabel { font-family:Arial,Helvetica,sans-serif; font-size:12px; text-anchor:middle; dominant-baseline:middle; fill:#000000; }
    </style>
  </defs>

  <!-- Nodes -->
  <g id="client_send_syn">
    <rect class="node" x="410" y="225" width="180" height="70"/>
    <text class="label" x="500" y="260">Client: SYN</text>
  </g>

  <g id="server_receive_syn">
    <rect class="node" x="810" y="225" width="180" height="70"/>
    <text class="label" x="900" y="260">Server receives SYN</text>
  </g>

  <g id="server_send_syn_ack">
    <rect class="node" x="810" y="385" width="180" height="70"/>
    <text class="label" x="900" y="420">Server: SYN‑ACK</text>
  </g>

  <g id="client_receive_syn_ack">
    <rect class="node" x="410" y="385" width="180" height="70"/>
    <text class="label" x="500" y="420">Client receives SYN‑ACK</text>
  </g>

  <g id="client_send_ack">
    <rect class="node" x="410" y="545" width="180" height="70"/>
    <text class="label" x="500" y="580">Client: ACK</text>
  </g>

  <g id="server_receive_ack">
    <rect class="node" x="810" y="545" width="180" height="70"/>
    <text class="label" x="900" y="580">Server receives ACK</text>
  </g>

  <g id="connection_established">
    <rect class="node" x="610" y="705" width="180" height="70"/>
    <text class="label" x="700" y="740">Connection Established</text>
  </g>

  <!-- Edges -->
  <path class="edge" d="M590,260 L810,260" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="700" y="250">SYN</text>

  <path class="edge" d="M810,295 L810,385" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="820" y="340">process SYN</text>

  <path class="edge" d="M990,420 L410,420" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="700" y="410">SYN‑ACK</text>

  <path class="edge" d="M410,455 L410,545" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="420" y="500">process SYN‑ACK</text>

  <path class="edge" d="M590,580 L810,580" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="700" y="570">ACK</text>

  <path class="edge" d="M810,580 L790,740" marker-end="url(#arrow)"/>
  <text class="edgelabel" x="800" y="650">established</text>
</svg>