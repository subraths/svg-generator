<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow_marker" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <style>
      .organelle { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .membrane { fill:none; stroke:#004d40; stroke-width:4; stroke-dasharray:10,5; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- Cell membrane (outer ellipse) -->
  <g id="cell_membrane">
    <ellipse cx="600" cy="400" rx="550" ry="350" class="membrane"/>
    <text x="600" y="70" text-anchor="middle" class="label">Cell Membrane</text>
  </g>

  <!-- Nucleus -->
  <g id="nucleus">
    <rect x="500" y="300" width="200" height="150" class="organelle"/>
    <text x="600" y="380" text-anchor="middle" class="label">Nucleus</text>
  </g>

  <!-- Mitochondrion -->
  <g id="mitochondrion">
    <rect x="200" y="150" width="150" height="80" class="organelle"/>
    <text x="275" y="200" text-anchor="middle" class="label">Mitochondrion</text>
  </g>

  <!-- Ribosome -->
  <g id="ribosome">
    <rect x="900" y="200" width="100" height="60" class="organelle"/>
    <text x="950" y="235" text-anchor="middle" class="label">Ribosome</text>
  </g>

  <!-- Golgi Apparatus -->
  <g id="golgi_apparatus">
    <rect x="800" y="500" width="150" height="100" class="organelle"/>
    <text x="875" y="560" text-anchor="middle" class="label">Golgi Apparatus</text>
  </g>

  <!-- Endoplasmic Reticulum -->
  <g id="endoplasmic_reticulum">
    <rect x="300" y="500" width="200" height="100" class="organelle"/>
    <text x="400" y="560" text-anchor="middle" class="label">Endoplasmic Reticulum</text>
  </g>

  <!-- Arrows showing relationships -->
  <!-- Nucleus → Ribosome (DNA → Protein synthesis) -->
  <path d="M600,300 L850,230" class="arrow" marker-end="url(#arrow_marker)"/>
  <text x="730" y="260" text-anchor="middle" class="label" font-size="16">DNA → Protein</text>

  <!-- Mitochondrion → Nucleus (Energy supply) -->
  <path d="M350,230 L500,300" class="arrow" marker-end="url(#arrow_marker)"/>
  <text x="425" y="270" text-anchor="middle" class="label" font-size="16">ATP</text>

  <!-- Endoplasmic Reticulum → Golgi Apparatus (Transport) -->
  <path d="M500,600 L800,550" class="arrow" marker-end="url(#arrow_marker)"/>
  <text x="650" y="620" text-anchor="middle" class="label" font-size="16">Proteins</text>
</svg>