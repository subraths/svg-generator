<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" fill="black">Transformer Architecture</text>

  <!-- Nodes -->
  <g id="input_embedding">
    <rect x="100" y="50" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="85" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Input Embedding</text>
  </g>

  <g id="positional_encoding">
    <rect x="100" y="140" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="175" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Positional Encoding</text>
  </g>

  <g id="add_norm_1">
    <rect x="100" y="230" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="265" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Add &amp; Norm</text>
  </g>

  <g id="multi_head_self_attention">
    <rect x="100" y="320" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="355" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Multi‑Head Self‑Attention</text>
  </g>

  <g id="add_norm_2">
    <rect x="100" y="410" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="445" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Add &amp; Norm</text>
  </g>

  <g id="feed_forward_network">
    <rect x="100" y="500" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="535" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Feed‑Forward Network</text>
  </g>

  <g id="add_norm_3">
    <rect x="100" y="590" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="625" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Add &amp; Norm</text>
  </g>

  <g id="output_projection">
    <rect x="100" y="680" width="180" height="70" fill="white" stroke="black"/>
    <text x="190" y="715" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Output Projection</text>
  </g>

  <!-- Edges -->
  <line x1="190" y1="120" x2="190" y2="140" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">embed</text>

  <line x1="190" y1="210" x2="190" y2="230" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">add</text>

  <line x1="190" y1="300" x2="190" y2="320" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">norm</text>

  <line x1="190" y1="390" x2="190" y2="410" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">add &amp; norm</text>

  <line x1="190" y1="480" x2="190" y2="500" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">ff</text>

  <line x1="190" y1="570" x2="190" y2="590" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="580" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">add &amp; norm</text>

  <line x1="190" y1="660" x2="190" y2="680" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="190" y="670" text-anchor="middle" font-family="sans-serif" font-size="12" fill="black">project</text>
</svg>