<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect x="450" y="50" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="90" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Client / Browser</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect x="450" y="170" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="210" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Recursive Resolver</text>
  </g>

  <!-- Root Name Server -->
  <g id="root_name_server">
    <rect x="450" y="290" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="330" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Root Name Server</text>
  </g>

  <!-- TLD Name Server -->
  <g id="tld_name_server">
    <rect x="450" y="410" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="450" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">TLD Name Server</text>
  </g>

  <!-- Authoritative Name Server -->
  <g id="authoritative_name_server">
    <rect x="450" y="530" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="570" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Authoritative Name Server</text>
  </g>

  <!-- Origin Server -->
  <g id="origin_server">
    <rect x="450" y="650" width="300" height="80" fill="#e0f7fa" stroke="black"/>
    <text x="600" y="690" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Origin Server (Website)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="130" x2="600" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="600" y2="410" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="610" x2="600" y2="650" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>