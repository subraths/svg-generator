<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- CPU Core -->
  <g id="cpu_core">
    <rect x="400" y="20" width="400" height="80" fill="#ffcccc" stroke="black"/>
    <text x="600" y="70" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">CPU Core</text>
  </g>

  <!-- Registers -->
  <g id="registers">
    <rect x="400" y="120" width="400" height="80" fill="#ffe5cc" stroke="black"/>
    <text x="600" y="170" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect x="400" y="220" width="400" height="80" fill="#ffffcc" stroke="black"/>
    <text x="600" y="270" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L1 Cache</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect x="400" y="320" width="400" height="80" fill="#e5ffcc" stroke="black"/>
    <text x="600" y="370" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L2 Cache</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect x="400" y="420" width="400" height="80" fill="#ccffcc" stroke="black"/>
    <text x="600" y="470" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">L3 Cache</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect x="400" y="520" width="400" height="80" fill="#cce5ff" stroke="black"/>
    <text x="600" y="570" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect x="400" y="620" width="400" height="80" fill="#d9cce5" stroke="black"/>
    <text x="600" y="670" font-family="sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="100" x2="600" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="200" x2="600" y2="220" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="300" x2="600" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="400" x2="600" y2="420" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="500" x2="600" y2="520" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="600" x2="600" y2="620" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>