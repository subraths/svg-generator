<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="light_absorption">
    <rect x="460" y="290" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="550" y="325" text-anchor="middle" dominant-baseline="middle" font-size="14">Light Absorption</text>
  </g>

  <g id="water_splitting">
    <rect x="460" y="380" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="550" y="415" text-anchor="middle" dominant-baseline="middle" font-size="14">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="460" y="470" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="550" y="505" text-anchor="middle" dominant-baseline="middle" font-size="14">Oxygen Release</text>
  </g>

  <g id="energy_carriers">
    <rect x="460" y="560" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="550" y="595" text-anchor="middle" dominant-baseline="middle" font-size="14">Energy Carriers (ATP, NADPH)</text>
  </g>

  <g id="co2_fixation">
    <rect x="760" y="380" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="850" y="415" text-anchor="middle" dominant-baseline="middle" font-size="14">CO₂ Fixation (Calvin Cycle)</text>
  </g>

  <g id="glucose_production">
    <rect x="760" y="470" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="850" y="505" text-anchor="middle" dominant-baseline="middle" font-size="14">Glucose Production</text>
  </g>

  <g id="starch_storage">
    <rect x="760" y="560" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="850" y="595" text-anchor="middle" dominant-baseline="middle" font-size="14">Starch Storage</text>
  </g>

  <!-- Edges -->
  <!-- light_absorption -> water_splitting -->
  <path d="M550,360 L550,380" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="555" y="370" font-size="12" fill="#000">energy</text>

  <!-- light_absorption -> energy_carriers -->
  <path d="M550,360 L550,560" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="555" y="460" font-size="12" fill="#000">produces</text>

  <!-- water_splitting -> oxygen_release -->
  <path d="M550,450 L550,470" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="555" y="460" font-size="12" fill="#000">O₂</text>

  <!-- water_splitting -> energy_carriers -->
  <path d="M550,450 L550,560" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="555" y="505" font-size="12" fill="#000">ATP/NADPH</text>

  <!-- energy_carriers -> co2_fixation -->
  <path d="M640,595 L760,415" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="505" font-size="12" fill="#000">provides ATP/NADPH</text>

  <!-- co2_fixation -> glucose_production -->
  <path d="M850,450 L850,470" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="855" y="460" font-size="12" fill="#000">produces</text>

  <!-- glucose_production -> starch_storage -->
  <path d="M850,540 L850,560" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="855" y="550" font-size="12" fill="#000">stores</text>

  <!-- light_absorption -> co2_fixation -->
  <path d="M640,325 L760,415" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="370" font-size="12" fill="#000">drives</text>
</svg>