<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Cell Membrane -->
  <g id="cell_membrane">
    <ellipse cx="600" cy="400" rx="560" ry="360" fill="none" stroke="black" stroke-width="3"/>
    <text x="600" y="45" text-anchor="middle" font-family="sans-serif" font-size="20" fill="black">Cell Membrane</text>
  </g>

  <!-- Nucleus -->
  <g id="nucleus">
    <circle cx="400" cy="300" r="80" fill="#ffcc99" stroke="black"/>
    <text x="400" y="300" dy="5" text-anchor="middle" font-family="sans-serif" font-size="18" fill="black">Nucleus</text>
  </g>

  <!-- Mitochondrion -->
  <g id="mitochondrion">
    <ellipse cx="800" cy="250" rx="70" ry="40" fill="#ff9999" stroke="black"/>
    <text x="800" y="250" dy="5" text-anchor="middle" font-family="sans-serif" font-size="18" fill="black">Mitochondrion</text>
  </g>

  <!-- Endoplasmic Reticulum -->
  <g id="endoplasmic_reticulum">
    <rect x="300" y="500" width="200" height="80" fill="#cce5ff" stroke="black"/>
    <text x="400" y="540" text-anchor="middle" font-family="sans-serif" font-size="18" fill="black">Endoplasmic Reticulum</text>
  </g>

  <!-- Golgi Apparatus -->
  <g id="golgi_apparatus">
    <rect x="600" y="500" width="200" height="80" fill="#ccffcc" stroke="black"/>
    <text x="700" y="540" text-anchor="middle" font-family="sans-serif" font-size="18" fill="black">Golgi Apparatus</text>
  </g>

  <!-- Ribosome -->
  <g id="ribosome">
    <circle cx="950" cy="400" r="20" fill="#ffff99" stroke="black"/>
    <text x="950" y="400" dy="5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="black">Ribosome</text>
  </g>

  <!-- Connectors with arrows -->
  <!-- Nucleus to Endoplasmic Reticulum -->
  <line x1="400" y1="300" x2="400" y2="500" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <text x="410" y="410" font-family="sans-serif" font-size="16" fill="black">RNA transport</text>

  <!-- Endoplasmic Reticulum to Golgi Apparatus -->
  <line x1="500" y1="540" x2="600" y2="540" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <text x="550" y="525" font-family="sans-serif" font-size="16" fill="black">Protein transport</text>

  <!-- Golgi Apparatus to Cell Membrane -->
  <line x1="700" y1="500" x2="700" y2="40" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <text x="710" y="270" font-family="sans-serif" font-size="16" fill="black">Vesicle transport</text>
</svg>