<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <style>
      .box { fill:#e0e0e0; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#000; stroke-width:2; marker-end:url(#arrowhead); }
    </style>
  </defs>

  <!-- User Browser -->
  <g id="user_browser">
    <rect class="box" x="50" y="300" width="150" height="80" rx="10" ry="10"/>
    <text class="label" x="125" y="340">User Browser</text>
  </g>

  <!-- Local Cache -->
  <g id="local_cache">
    <rect class="box" x="250" y="300" width="150" height="80" rx="10" ry="10"/>
    <text class="label" x="325" y="340">Local DNS Cache</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect class="box" x="450" y="300" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="540" y="340">Recursive Resolver (ISP)</text>
  </g>

  <!-- Root Server -->
  <g id="root_server">
    <rect class="box" x="700" y="150" width="150" height="80" rx="10" ry="10"/>
    <text class="label" x="775" y="190">Root Name Server</text>
  </g>

  <!-- TLD Server -->
  <g id="tld_server">
    <rect class="box" x="700" y="300" width="150" height="80" rx="10" ry="10"/>
    <text class="label" x="775" y="340">TLD Name Server</text>
  </g>

  <!-- Authoritative Server -->
  <g id="authoritative_server">
    <rect class="box" x="700" y="450" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="790" y="490">Authoritative Server</text>
  </g>

  <!-- IP Address Response -->
  <g id="ip_address">
    <rect class="box" x="900" y="300" width="80" height="80" rx="10" ry="10"/>
    <text class="label" x="940" y="340">IP Addr</text>
  </g>

  <!-- Arrows showing flow -->
  <line class="arrow" x1="200" y1="340" x2="250" y2="340"/>
  <line class="arrow" x1="400" y1="340" x2="450" y2="340"/>
  <line class="arrow" x1="630" y1="340" x2="700" y2="190"/>
  <line class="arrow" x1="775" y1="230" x2="775" y2="300"/>
  <line class="arrow" x1="775" y1="380" x2="775" y2="450"/>
  <line class="arrow" x1="880" y1="490" x2="900" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <line class="arrow" x1="940" y1="380" x2="940" y2="340"/>
  <!-- Return path from IP address to browser -->
  <line class="arrow" x1="940" y1="340" x2="125" y2="340"/>
</svg>