<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .box { fill:#f9f9f9; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
      .arrow { stroke:#000; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect class="box" x="100" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="200" y="355" text-anchor="middle">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect class="box" x="900" y="300" width="200" height="100" rx="10" ry="10"/>
    <text class="label" x="1000" y="355" text-anchor="middle">Server</text>
  </g>

  <!-- SYN message -->
  <g id="syn_message">
    <line class="arrow" x1="300" y1="350" x2="900" y2="350" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="340" text-anchor="middle">SYN</text>
  </g>

  <!-- SYN-ACK message -->
  <g id="synack_message">
    <line class="arrow" x1="900" y1="400" x2="300" y2="400" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="390" text-anchor="middle">SYN‑ACK</text>
  </g>

  <!-- ACK message -->
  <g id="ack_message">
    <line class="arrow" x1="300" y1="450" x2="900" y2="450" marker-end="url(#arrowhead)"/>
    <text class="label" x="600" y="440" text-anchor="middle">ACK</text>
  </g>

  <!-- Established state -->
  <g id="established_state">
    <text class="label" x="600" y="550" text-anchor="middle">Connection Established</text>
  </g>
</svg>