<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>
  <title>Photosynthesis</title>
  <g transform="translate(190,165)">
    <!-- Edges -->
    <path d="M200,55 L220,55" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="210" y="45" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">absorbs</text>

    <path d="M400,55 L420,55" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="410" y="45" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">excites</text>

    <path d="M510,90 L510,110" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="515" y="100" font-family="sans-serif" font-size="12" text-anchor="start" dominant-baseline="middle">drives</text>

    <path d="M600,55 L620,145" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="610" y="95" font-family="sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">produces</text>

    <path d="M510,180 L510,200" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="515" y="190" font-family="sans-serif" font-size="12" text-anchor="start" dominant-baseline="middle">releases O₂</text>

    <path d="M710,180 L710,200" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="715" y="190" font-family="sans-serif" font-size="12" text-anchor="start" dominant-baseline="middle">provides ATP/NADPH</text>

    <path d="M710,270 L710,290" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="715" y="280" font-family="sans-serif" font-size="12" text-anchor="start" dominant-baseline="middle">initiates</text>

    <path d="M710,360 L710,380" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="715" y="370" font-family="sans-serif" font-size="12" text-anchor="start" dominant-baseline="middle">forms glucose</text>

    <!-- Nodes -->
    <g id="sunlight">
      <rect x="20" y="20" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
      <text x="110" y="55" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Sunlight</text>
    </g>

    <g id="chlorophyll">
      <rect x="220" y="20" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
      <text x="310" y="55" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Chlorophyll</text>
    </g>

    <g id="light_dependent">
      <rect x="420" y="20" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
      <text x="510" y="55" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Light‑dependent Reactions</text>
    </g>

    <g id="water_splitting">
      <rect x="420" y="110" width="180" height="70" fill="#e0f7fa" stroke="#006064