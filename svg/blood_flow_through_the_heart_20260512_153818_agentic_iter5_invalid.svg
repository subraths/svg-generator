      <rect class="node-rect" x="20" y="20" width="180" height="70"/>
      <text class="node-text" x="110" y="55" dominant-baseline="middle" text-anchor="middle">Superior Vena Cava</text>
    </g>

    <g id="right_atrium">
      <rect class="node-rect" x="20" y="110" width="180" height="70"/>
