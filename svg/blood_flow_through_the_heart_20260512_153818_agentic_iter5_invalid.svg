<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node-rect { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .node-text { font-family:Arial,Helvetica,sans-serif; font-size:14px; fill:#004d40; }
      .edge-path { fill:none; stroke:#000; stroke-width:2; }
    </style>
  </defs>

  <!-- Center the whole diagram -->
  <g transform="translate(130,120)">

    <!-- Title -->
    <text x="600" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#000">Blood Flow Through the Heart</text>

    <!-- Nodes -->
