<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" fill="black">Transformer Architecture</text>

  <!-- Nodes -->
  <g id="input_embedding">
    <rect x="40" y="200" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="130" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Input Embedding</text>
  </g>

  <g id="positional_encoding">
    <rect x="240" y="200" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="330" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Positional Encoding</text>
  </g>

  <g id="encoder_stack">
    <rect x="460" y="200" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="550" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Encoder Stack (N×)</text>
  </g>

  <g id="decoder_stack">
    <rect x="460" y="340" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="550" y="375" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Decoder Stack (N×)</text>
  </g>

  <g id="output_projection">
    <rect x="680" y="200" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="770" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Output Projection</text>
  </g>

  <g id="final_output">
    <rect x="900" y="200" width="180" height="70" fill="#e0e0e0" stroke="black"/>
    <text x="990" y="235" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Final Output</text>
  </g>

  <!-- Edges -->
  <line x1="220" y1="235" x2="240" y2="235" stroke="black" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="235" x2="460" y2="235" stroke="black" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="270" x2="550" y2="340" stroke="black" marker-end="url(#arrowhead)"/>
  <text x="550" y="305" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12" fill="black">Cross‑Attention</text>
  <line x1="640" y1="375" x2="680" y2="235" stroke="black" marker-end="url(#arrowhead)"/>
  <line x1="860" y1="235" x2="900" y2="235" stroke="black" marker-end="url(#arrowhead)"/>
</svg>