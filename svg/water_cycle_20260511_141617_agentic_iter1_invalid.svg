<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 -5 10 10" refX="5" refY="0"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="black"/>
    </marker>
    <style>
      .node { fill:#e0f7ff; stroke:#000; stroke-width:1.5; }
      .edge { stroke:#000; stroke-width:1.5; fill:none; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#000; }
    </style>
  </defs>

  <!-- Nodes -->
  <g id="evaporation">
    <rect class="node" x="510" y="105" width="180" height="70" rx="5" ry="5"/>
    <text x="600" y="140" text-anchor="middle" dominant-baseline="middle">Evaporation</text>
  </g>

  <g id="transpiration">
    <rect class="node" x="690" y="185" width="180" height="70" rx="5" ry="5"/>
    <text x="780" y="220" text-anchor="middle" dominant-baseline="middle">Transpiration</text>
  </g>

  <g id="condensation">
    <rect class="node" x="770" y="365" width="180" height="70" rx="5" ry="5"/>
    <text x="860" y="400" text-anchor="middle" dominant-baseline="middle">Condensation</text>
  </g>

  <g id="precipitation">
    <rect class="node" x="330" y="185" width="180" height="70" rx="5" ry="5"/>
    <text x="420" y="220" text-anchor="middle" dominant-baseline="middle">Precipitation</text>
  </g>

  <g id="collection">
    <rect class="node" x="510" y="625" width="180" height="70" rx="5" ry="5"/>
    <text x="600" y="660" text-anchor="middle" dominant-baseline="middle">Collection</text>
  </g>

  <g id="infiltration">
    <rect class="node" x="330" y="545" width="180" height="70" rx="5" ry="5"/>
    <text x="420" y="580" text-anchor="middle" dominant-baseline="middle">Infiltration</text>
  </g>

  <g id="runoff">
    <rect class="node" x="250" y="365" width="180" height="70" rx="5" ry="5"/>
    <text x="340" y="400" text-anchor="middle" dominant-baseline="middle">Runoff</text>
  </g>

  <g id="sublimation">
    <rect class="node" x="290" y="105" width="180" height="70" rx="5" ry="5"/>
    <text x="380" y="140" text-anchor="middle" dominant-baseline="middle">Sublimation</text>
  </g>

  <!-- Edges -->
  <g class="edge">
    <line x1="690" y1="140" x2="770" y2="400" marker-end="url(#arrowhead)"/>
    <text x="730" y="270" class="label" text-anchor="middle" dominant-baseline="middle">water vapor rises</text>
  </g>

  <g class="edge">
    <line x1="870" y1="220" x2="770" y2="400" marker-end="url(#arrowhead)"/>
    <text x="820" y="310" class="label" text-anchor="middle" dominant-baseline="middle">plant vapor</text>
  </g>

  <g class="edge">
    <line x1="770" y1="400" x2="510" y2="220" marker-end="url(#arrowhead)"/>
    <text x="640" y="310" class="label" text-anchor="middle" dominant-baseline="middle">cloud formation</text>
  </g>

  <g class="edge">
    <line x1="510" y1="220" x2="510" y2="660" marker-end="url(#arrowhead)"/>
    <text x="510" y="440" class="label" text-anchor="middle" dominant-baseline="middle">rain/snow</text>
  </g>

  <g class="edge">
    <line x1="510" y1="660" x2="510" y2="580" marker-end="url(#arrowhead)"/>
    <text x="510" y="620" class="label" text-anchor="middle" dominant-baseline="middle">water enters soil</text>
  </g>

  <g class="edge">
    <line x1="330" y1="580" x2="430" y2="400" marker-end="url(#arrowhead)"/>
    <text x="380" y="490" class="label" text-anchor="middle" dominant-baseline="middle">groundwater flow</text>
  </g>

  <g class="edge">
    <line x1="430" y1="400" x2="510" y2="140" marker-end="url(#arrowhead)"/>
    <text x="470" y="270" class="label