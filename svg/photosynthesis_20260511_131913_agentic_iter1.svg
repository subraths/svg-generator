<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node-rect { fill:#fff; stroke:#000; stroke-width:2; }
      .node-label { font-family:sans-serif; font-size:14px; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
      .edge-path { fill:none; stroke:#000; stroke-width:2; marker-end:url(#arrow); }
      .edge-label { font-family:sans-serif; font-size:12px; text-anchor:middle; dominant-baseline:middle; background:#fff; }
      .title { font-family:sans-serif; font-size:24px; text-anchor:middle; font-weight:bold; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="15" class="title">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="light_absorption">
    <rect x="500" y="20" width="180" height="70" class="node-rect"/>
    <text x="590" y="55" class="node-label">Light Absorption</text>
  </g>

  <g id="water_uptake">
    <rect x="500" y="120" width="180" height="70" class="node-rect"/>
    <text x="590" y="155" class="node-label">Water Uptake (H₂O)</text>
  </g>

  <g id="energy_storage">
    <rect x="500" y="240" width="180" height="70" class="node-rect"/>
    <text x="590" y="275" class="node-label">Energy Storage (ATP, NADPH)</text>
  </g>

  <g id="co2_fixation">
    <rect x="500" y="360" width="180" height="70" class="node-rect"/>
    <text x="590" y="395" class="node-label">CO₂ Fixation</text>
  </g>

  <g id="calvin_cycle">
    <rect x="500" y="480" width="180" height="70" class="node-rect"/>
    <text x="590" y="515" class="node-label">Calvin Cycle</text>
  </g>

  <g id="glucose_production">
    <rect x="500" y="600" width="180" height="70" class="node-rect"/>
    <text x="590" y="635" class="node-label">Glucose Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="500" y="720" width="180" height="70" class="node-rect"/>
    <text x="590" y="755" class="node-label">Oxygen Release (O₂)</text>
  </g>

  <!-- Edges -->
  <g id="edge_water_uptake_to_light_absorption">
    <path d="M590,120 L590,90" class="edge-path"/>
    <text x="590" y="105" class="edge-label">provides electrons</text>
  </g>

  <g id="edge_light_absorption_to_energy_storage">
    <path d="M590,90 L590,240" class="edge-path"/>
    <text x="590" y="165" class="edge-label">produces ATP/NADPH</text>
  </g>

  <g id="edge_light_absorption_to_oxygen_release">
    <path d="M680,55 L800,55 L800,755 L500,755" class="edge-path"/>
    <text x="800" y="405" class="edge-label">releases O₂</text>
  </g>

  <g id="edge_energy_storage_to_calvin_cycle">
    <path d="M680,275 L800,275 L800,515 L500,515" class="edge-path"/>
    <text x="800" y="395" class="edge-label">powers</text>
  </g>

  <g id="edge_co2_fixation_to_calvin_cycle">
    <path d="M590,430 L590,480" class="edge-path"/>
    <text x="590" y="455" class="edge-label">feeds</text>
  </g>

  <g id="edge_calvin_cycle_to_glucose_production">
    <path d="M590,550 L590,600" class="edge-path"/>
    <text x="590" y="575" class="edge-label">produces</text>
  </g>
</svg>