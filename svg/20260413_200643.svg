<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect x="50" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="110" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Client (Browser)</text>
  </g>

  <!-- DNS Lookup -->
  <g id="dns_lookup">
    <rect x="200" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="260" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">DNS Lookup</text>
  </g>

  <!-- TCP Connection -->
  <g id="tcp_connection">
    <rect x="350" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="410" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">TCP Connection</text>
  </g>

  <!-- HTTP Request -->
  <g id="http_request">
    <rect x="500" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="560" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">HTTP Request</text>
  </g>

  <!-- Server Processing -->
  <g id="server_processing">
    <rect x="650" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="710" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Server Processing</text>
  </g>

  <!-- HTTP Response -->
  <g id="http_response">
    <rect x="800" y="250" width="120" height="80" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="860" y="295" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">HTTP Response</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="170" y1="290" x2="200" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="290" x2="350" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="290" x2="500" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="290" x2="650" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="770" y1="290" x2="800" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Return arrow from response to client (via a loop) -->
  <polyline points="860,290 860,400 110,400 110,290"
            fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>