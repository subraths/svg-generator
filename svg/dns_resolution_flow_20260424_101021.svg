<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; dominant-baseline:middle; text-anchor:middle; }
    </style>
  </defs>

  <!-- Application Request -->
  <g id="application_request">
    <rect class="box" x="510" y="50" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="90">Application Request</text>
  </g>

  <!-- Stub Resolver -->
  <g id="stub_resolver">
    <rect class="box" x="510" y="160" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="200">Stub Resolver (OS)</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect class="box" x="510" y="270" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="310">Recursive Resolver (ISP)</text>
  </g>

  <!-- Root Name Server -->
  <g id="root_server">
    <rect class="box" x="510" y="380" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="420">Root Name Server</text>
  </g>

  <!-- TLD Name Server -->
  <g id="tld_server">
    <rect class="box" x="510" y="490" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="530">TLD Name Server</text>
  </g>

  <!-- Authoritative Name Server -->
  <g id="authoritative_server">
    <rect class="box" x="510" y="600" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="640">Authoritative Server</text>
  </g>

  <!-- Final Response -->
  <g id="final_response">
    <rect class="box" x="510" y="710" width="180" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="750">Final Response to App</text>
  </g>

  <!-- Connectors -->
  <path d="M600,130 V160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M600,240 V270" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M600,350 V380" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M600,460 V490" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M600,570 V600" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M600,680 V710" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>