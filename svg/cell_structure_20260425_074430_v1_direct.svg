<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow_head" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Cell Membrane (outer boundary) -->
  <g id="cell_membrane">
    <ellipse cx="600" cy="400" rx="500" ry="350" fill="none" stroke="#555" stroke-width="4"/>
    <text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#555">Cell Membrane</text>
  </g>

  <!-- Nucleus -->
  <g id="nucleus">
    <rect x="200" y="150" width="200" height="200" fill="#cce5ff" stroke="#3366cc" stroke-width="2"/>
    <text x="300" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#000">Nucleus</text>
  </g>

  <!-- Mitochondria -->
  <g id="mitochondria">
    <rect x="600" y="150" width="180" height="120" fill="#ffe5cc" stroke="#cc6600" stroke-width="2"/>
    <text x="690" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#000">Mitochondria</text>
  </g>

  <!-- Endoplasmic Reticulum -->
  <g id="endoplasmic_reticulum">
    <rect x="200" y="400" width="250" height="120" fill="#e6ffe6" stroke="#339933" stroke-width="2"/>
    <text x="325" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#000">Endoplasmic Reticulum</text>
  </g>

  <!-- Golgi Apparatus -->
  <g id="golgi_apparatus">
    <rect x="600" y="400" width="200" height="120" fill="#fff0f5" stroke="#cc3399" stroke-width="2"/>
    <text x="700" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#000">Golgi Apparatus</text>
  </g>

  <!-- Ribosome -->
  <g id="ribosome">
    <rect x="100" y="600" width="80" height="80" fill="#ffffcc" stroke="#999900" stroke-width="2"/>
    <text x="140" y="650" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#000">Ribosome</text>
  </g>

  <!-- Arrows showing relationships -->
  <!-- Nucleus → Endoplasmic Reticulum -->
  <line x1="300" y1="350" x2="300" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow_head)"/>
  <!-- Nucleus → Ribosome -->
  <line x1="300" y1="350" x2="140" y2="600" stroke="black" stroke-width="2" marker-end="url(#arrow_head)"/>
  <!-- Mitochondria → Golgi Apparatus -->
  <line x1="690" y1="270" x2="690" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrow_head)"/>
  <!-- Golgi Apparatus → Ribosome -->
  <line x1="700" y1="520" x2="140" y2="680" stroke="black" stroke-width="2" marker-end="url(#arrow_head)"/>
</svg>