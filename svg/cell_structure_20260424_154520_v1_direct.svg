<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Cell Membrane -->
  <g id="cell_membrane">
    <rect x="500" y="50" width="200" height="80" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="600" y="95" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Cell Membrane</text>
  </g>

  <!-- Nucleus -->
  <g id="nucleus">
    <rect x="100" y="200" width="180" height="120" fill="#ffcccc" stroke="#333" stroke-width="2"/>
    <text x="190" y="260" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Nucleus</text>
  </g>

  <!-- Mitochondria -->
  <g id="mitochondria">
    <rect x="100" y="400" width="180" height="80" fill="#ffe5b4" stroke="#333" stroke-width="2"/>
    <text x="190" y="445" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Mitochondria</text>
  </g>

  <!-- Endoplasmic Reticulum -->
  <g id="endoplasmic_reticulum">
    <rect x="500" y="200" width="200" height="120" fill="#d5f5e3" stroke="#333" stroke-width="2"/>
    <text x="600" y="260" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Endoplasmic Reticulum</text>
  </g>

  <!-- Golgi Apparatus -->
  <g id="golgi_apparatus">
    <rect x="500" y="400" width="200" height="80" fill="#f9e79f" stroke="#333" stroke-width="2"/>
    <text x="600" y="445" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Golgi Apparatus</text>
  </g>

  <!-- Lysosome -->
  <g id="lysosome">
    <rect x="850" y="200" width="180" height="80" fill="#e6ccff" stroke="#333" stroke-width="2"/>
    <text x="940" y="245" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Lysosome</text>
  </g>

  <!-- Ribosome -->
  <g id="ribosome">
    <rect x="850" y="400" width="180" height="80" fill="#ffebcc" stroke="#333" stroke-width="2"/>
    <text x="940" y="445" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000">Ribosome</text>
  </g>

  <!-- Connectors -->
  <line x1="280" y1="260" x2="500" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="280" y1="440" x2="500" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="320" x2="600" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="600" y1="400" x2="600" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="850" y1="240" x2="700" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
  <line x1="850" y1="440" x2="700" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>