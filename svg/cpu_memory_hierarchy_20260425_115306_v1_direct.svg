<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .block { fill:#f0f0f0; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:20px; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- CPU Registers -->
  <g id="cpu_registers">
    <rect class="block" x="200" y="50" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="90">CPU Registers</text>
  </g>

  <!-- L1 Cache -->
  <g id="l1_cache">
    <rect class="block" x="200" y="170" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="210">L1 Cache (Fastest Cache)</text>
  </g>

  <!-- L2 Cache -->
  <g id="l2_cache">
    <rect class="block" x="200" y="290" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="330">L2 Cache (Larger, Slightly Slower)</text>
  </g>

  <!-- L3 Cache -->
  <g id="l3_cache">
    <rect class="block" x="200" y="410" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="450">L3 Cache (Shared, Larger)</text>
  </g>

  <!-- Main Memory -->
  <g id="main_memory">
    <rect class="block" x="200" y="530" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="570">Main Memory (RAM)</text>
  </g>

  <!-- Secondary Storage -->
  <g id="secondary_storage">
    <rect class="block" x="200" y="650" width="800" height="80" rx="10" ry="10"/>
    <text class="label" x="600" y="690">Secondary Storage (SSD/HDD)</text>
  </g>

  <!-- Connectors -->
  <line x1="600" y1="130" x2="600" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="250" x2="600" y2="290" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="600" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="610" x2="600" y2="650" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>