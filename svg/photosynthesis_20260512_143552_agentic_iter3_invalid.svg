<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
  </defs>
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="24">Photosynthesis</text>
  <g transform="translate(80,175)">
    <!-- Nodes -->
    <g id="light_absorption">
      <rect x="100" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="190" y="140" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light Absorption</text>
    </g>
    <g id="water_splitting">
      <rect x="100" y="190" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="190" y="230" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Splitting</text>
    </g>
    <g id="co2_fixation">
      <rect x="100" y="280" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="190" y="320" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">CO₂ Fixation (Rubisco)</text>
    </g>
    <g id="thylakoid_membrane">
      <rect x="320" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="410" y="140" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Thylakoid Membrane</text>
    </g>
    <g id="stroma">
      <rect x="320" y="190" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="410" y="230" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Stroma</text>
    </g>
    <g id="calvin_cycle">
      <rect x="540" y="190" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="630" y="230" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle</text>
    </g>
    <g id="glucose_production">
      <rect x="760" y="100" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="850" y="140" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Production</text>
    </g>
    <g id="oxygen_release">
      <rect x="760" y="200" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
      <text x="850" y="240" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Oxygen Release</text>
    </g>

    <!-- Edges -->
    <g id="edge_light_absorption_water_splitting">
      <line x1="190" y1="170" x2="190" y2="190" stroke="#000" marker-end="url(#arrow)"/>
      <text x="190" y="180" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">drives</text>
    </g>
    <g id="edge_light_absorption_thylakoid_membrane">
      <line x1="280" y1="135" x2="320" y2="135" stroke="#000" marker-end="url(#arrow)"/>
      <text x="300" y="125" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">occurs in</text>
    </g>
    <g id="edge_thylakoid_membrane_water_splitting">
      <line x1="410" y1="170" x2="100" y2="225" stroke="#000" marker-end="url(#arrow)"/>
      <text x="255" y="197.5" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">contains</text>
    </g>
    <g id="edge_water_splitting_oxygen_release">
      <line x1="280" y1="225" x2="760" y2="235" stroke="#000" marker-end="url(#arrow)"/>
      <text x="520" y="230" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">produces O₂</text>
    </g>
    <g id="edge_water_splitting_calvin_cycle">
      <line x1="280" y1="225" x2="540" y2="225" stroke="#000" marker-end="url(#arrow)"/>
      <text x="410" y="215" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12