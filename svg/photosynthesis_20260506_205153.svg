<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="15" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#000">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="chlorophyll">
    <rect x="20" y="20" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="110" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Chlorophyll Pigments</text>
  </g>

  <g id="light_absorption">
    <rect x="240" y="20" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="330" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Light Absorption</text>
  </g>

  <g id="energy_conversion">
    <rect x="460" y="20" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="550" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Energy Conversion (ATP/NADPH)</text>
  </g>

  <g id="water_uptake">
    <rect x="680" y="20" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="770" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Water Uptake</text>
  </g>

  <g id="oxygen_release">
    <rect x="900" y="20" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="990" y="55" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Oxygen Release</text>
  </g>

  <g id="carbon_fixation">
    <rect x="240" y="120" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="330" y="155" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Carbon Fixation (Calvin Cycle)</text>
  </g>

  <g id="glucose_production">
    <rect x="460" y="120" width="180" height="70" fill="#c8e6c9" stroke="#000"/>
    <text x="550" y="155" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Glucose Production</text>
  </g>

  <!-- Edges -->
  <!-- chlorophyll -> light_absorption -->
  <line x1="200" y1="55" x2="240" y2="55" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- light_absorption -> energy_conversion -->
  <line x1="420" y1="55" x2="460" y2="55" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- energy_conversion -> carbon_fixation (curved) -->
  <path d="M550,90 C550,130 330,90 330,120" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- water_uptake -> oxygen_release -->
  <line x1="860" y1="55" x2="900" y2="55" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- water_uptake -> energy_conversion (curved left) -->
  <path d="M680,55 C680,30 640,30 640,55" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- carbon_fixation -> glucose_production -->
  <line x1="420" y1="155" x2="460" y2="155" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>