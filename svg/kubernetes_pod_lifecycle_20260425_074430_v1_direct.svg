<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
    <style>
      .box { stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
      .title { font-family:sans-serif; font-size:24px; font-weight:bold; fill:#000; text-anchor:middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="50" class="title">Kubernetes Pod Lifecycle</text>

  <!-- Pending -->
  <g id="g_pending">
    <rect x="100" y="100" width="200" height="60" fill="#e0f7fa" class="box"/>
    <text x="200" y="130" class="label">Pending</text>
  </g>

  <!-- ContainerCreating -->
  <g id="g_container_creating">
    <rect x="100" y="200" width="200" height="60" fill="#fff3e0" class="box"/>
    <text x="200" y="230" class="label">ContainerCreating</text>
  </g>

  <!-- Running -->
  <g id="g_running">
    <rect x="100" y="300" width="200" height="60" fill="#e8f5e9" class="box"/>
    <text x="200" y="330" class="label">Running</text>
  </g>

  <!-- Succeeded -->
  <g id="g_succeeded">
    <rect x="400" y="300" width="200" height="60" fill="#e0f2f1" class="box"/>
    <text x="500" y="330" class="label">Succeeded</text>
  </g>

  <!-- Failed -->
  <g id="g_failed">
    <rect x="400" y="380" width="200" height="60" fill="#ffebee" class="box"/>
    <text x="500" y="410" class="label">Failed</text>
  </g>

  <!-- Unknown -->
  <g id="g_unknown">
    <rect x="400" y="460" width="200" height="60" fill="#f3e5f5" class="box"/>
    <text x="500" y="490" class="label">Unknown</text>
  </g>

  <!-- Connectors -->
  <line x1="200" y1="160" x2="200" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="260" x2="200" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="330" x2="400" y2="330" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="350" x2="400" y2="410" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="370" x2="400" y2="490" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>