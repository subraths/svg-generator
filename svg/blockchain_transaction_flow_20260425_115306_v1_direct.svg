<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
    <style>
      .box { fill:#e0f7ff; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .connector { stroke:#000; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- User -->
  <g id="user">
    <rect class="box" x="75" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="150" y="400">User</text>
  </g>

  <!-- Transaction -->
  <g id="transaction">
    <rect class="box" x="255" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="330" y="400">Create Transaction</text>
  </g>

  <!-- Miner -->
  <g id="miner">
    <rect class="box" x="435" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="510" y="400">Miner Validates</text>
  </g>

  <!-- Block -->
  <g id="block">
    <rect class="box" x="615" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="690" y="400">Form Block</text>
  </g>

  <!-- Blockchain -->
  <g id="blockchain">
    <rect class="box" x="795" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="870" y="400">Add to Chain</text>
  </g>

  <!-- Confirmation -->
  <g id="confirmation">
    <rect class="box" x="975" y="360" width="150" height="80" rx="8" ry="8"/>
    <text class="label" x="1050" y="400">Confirmation</text>
  </g>

  <!-- Connectors -->
  <path class="connector" d="M225,400 L255,400" marker-end="url(#arrowhead)"/>
  <path class="connector" d="M405,400 L435,400" marker-end="url(#arrowhead)"/>
  <path class="connector" d="M585,400 L615,400" marker-end="url(#arrowhead)"/>
  <path class="connector" d="M765,400 L795,400" marker-end="url(#arrowhead)"/>
  <path class="connector" d="M945,400 L975,400" marker-end="url(#arrowhead)"/>
</svg>