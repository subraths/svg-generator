<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Cell membrane (outer boundary) -->
  <g id="cell_membrane">
    <ellipse cx="600" cy="400" rx="550" ry="350" fill="none" stroke="black" stroke-width="4"/>
    <text x="600" y="40" font-family="sans-serif" font-size="24" text-anchor="middle">Cell Structure</text>
  </g>

  <!-- Nucleus -->
  <g id="nucleus">
    <rect x="300" y="200" width="200" height="150" fill="#f0e68c" stroke="black" stroke-width="2"/>
    <text x="400" y="275" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Nucleus</text>
  </g>

  <!-- Mitochondria -->
  <g id="mitochondria">
    <rect x="600" y="250" width="150" height="80" fill="#add8e6" stroke="black" stroke-width="2"/>
    <text x="675" y="290" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Mitochondria</text>
  </g>

  <!-- Endoplasmic Reticulum -->
  <g id="endoplasmic_reticulum">
    <rect x="300" y="400" width="250" height="100" fill="#90ee90" stroke="black" stroke-width="2"/>
    <text x="425" y="450" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Endoplasmic Reticulum</text>
  </g>

  <!-- Golgi Apparatus -->
  <g id="golgi_apparatus">
    <rect x="600" y="400" width="200" height="100" fill="#ffb6c1" stroke="black" stroke-width="2"/>
    <text x="700" y="450" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Golgi Apparatus</text>
  </g>

  <!-- Ribosome -->
  <g id="ribosome">
    <rect x="500" y="130" width="80" height="50" fill="#d3d3d3" stroke="black" stroke-width="2"/>
    <text x="540" y="155" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Ribosome</text>
  </g>

  <!-- Lysosome -->
  <g id="lysosome">
    <rect x="800" y="130" width="80" height="50" fill="#ffa07a" stroke="black" stroke-width="2"/>
    <text x="840" y="155" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Lysosome</text>
  </g>

  <!-- Arrows showing relationships -->
  <!-- Nucleus → Mitochondria -->
  <line x1="500" y1="275" x2="600" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Endoplasmic Reticulum → Golgi Apparatus -->
  <line x1="550" y1="450" x2="600" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Ribosome → Endoplasmic Reticulum -->
  <line x1="540" y1="180" x2="425" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>

  <!-- Lysosome → Golgi Apparatus -->
  <line x1="840" y1="155" x2="700" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
</svg>