<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Input Layer -->
  <g id="input_layer">
    <rect x="100" y="250" width="150" height="300" fill="#e0f7fa" stroke="black"/>
    <text x="175" y="240" text-anchor="middle" font-family="sans-serif" font-size="18">Input Layer</text>
  </g>

  <!-- Hidden Layer 1 -->
  <g id="hidden1_layer">
    <rect x="350" y="200" width="150" height="300" fill="#fff9c4" stroke="black"/>
    <text x="425" y="190" text-anchor="middle" font-family="sans-serif" font-size="18">Hidden Layer 1</text>
  </g>

  <!-- Hidden Layer 2 -->
  <g id="hidden2_layer">
    <rect x="600" y="200" width="150" height="300" fill="#fff9c4" stroke="black"/>
    <text x="675" y="190" text-anchor="middle" font-family="sans-serif" font-size="18">Hidden Layer 2</text>
  </g>

  <!-- Output Layer -->
  <g id="output_layer">
    <rect x="850" y="300" width="150" height="200" fill="#ffe0b2" stroke="black"/>
    <text x="925" y="290" text-anchor="middle" font-family="sans-serif" font-size="18">Output Layer</text>
  </g>

  <!-- Weights (arrows) -->
  <g id="weights">
    <line x1="250" y1="400" x2="350" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="350" x2="600" y2="350" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="750" y1="350" x2="850" y2="400" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Activation Functions -->
  <g id="activation">
    <text x="425" y="150" text-anchor="middle" font-family="sans-serif" font-size="18">ReLU</text>
    <text x="675" y="150" text-anchor="middle" font-family="sans-serif" font-size="18">ReLU</text>
    <text x="925" y="260" text-anchor="middle" font-family="sans-serif" font-size="18">Softmax</text>
  </g>

  <!-- Bias addition -->
  <g id="bias">
    <text x="425" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">+ Bias b₁</text>
    <text x="675" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">+ Bias b₂</text>
    <text x="925" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">+ Bias b₃</text>
  </g>
</svg>