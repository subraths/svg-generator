<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .node-rect { fill:#f0f8ff; stroke:#000; stroke-width:2; }
      .node-label { font-family:sans-serif; font-size:16px; pointer-events:none; }
      .edge-label { font-family:sans-serif; font-size:14px; fill:#000; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">TCP Handshake Process</text>

  <!-- Nodes -->
  <g id="client_send_syn">
    <rect class="node-rect" x="510" y="65" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="105" text-anchor="middle" dominant-baseline="middle">Client: SEND SYN</text>
  </g>

  <g id="server_receive_syn">
    <rect class="node-rect" x="510" y="165" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="205" text-anchor="middle" dominant-baseline="middle">Server: RECEIVE SYN</text>
  </g>

  <g id="server_send_synack">
    <rect class="node-rect" x="510" y="265" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="305" text-anchor="middle" dominant-baseline="middle">Server: SEND SYN‑ACK</text>
  </g>

  <g id="client_receive_synack">
    <rect class="node-rect" x="510" y="365" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="405" text-anchor="middle" dominant-baseline="middle">Client: RECEIVE SYN‑ACK</text>
  </g>

  <g id="client_send_ack">
    <rect class="node-rect" x="510" y="465" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="505" text-anchor="middle" dominant-baseline="middle">Client: SEND ACK</text>
  </g>

  <g id="server_receive_ack">
    <rect class="node-rect" x="510" y="565" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="605" text-anchor="middle" dominant-baseline="middle">Server: RECEIVE ACK</text>
  </g>

  <g id="connection_established">
    <rect class="node-rect" x="510" y="665" width="180" height="70" rx="5" ry="5"/>
    <text class="node-label" x="600" y="705" text-anchor="middle" dominant-baseline="middle">Connection ESTABLISHED</text>
  </g>

  <!-- Edges -->
  <g id="edges">
    <!-- client_send_syn -> server_receive_syn -->
    <line x1="600" y1="135" x2="600" y2="165" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text class="edge-label" x="605" y="150" dominant-baseline="middle">SYN</text>

    <!-- server_receive_syn -> server_send_synack -->
    <line x1="600" y1="235" x2="600" y2="265" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- server_send_synack -> client_receive_synack -->
    <line x1="600" y1="335" x2="600" y2="365" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text class="edge-label" x="605" y="350" dominant-baseline="middle">SYN‑ACK</text>

    <!-- client_receive_synack -> client_send_ack -->
    <line x1="600" y1="435" x2="600" y2="465" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- client_send_ack -> server_receive_ack -->
    <line x1="600" y1="535" x2="600" y2="565" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text class="edge-label" x="605" y="550" dominant-baseline="middle">ACK</text>

    <!-- server_receive_ack -> connection_established -->
    <line x1="600" y1="635" x2="600" y2="665" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
</svg>