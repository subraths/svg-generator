<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold">Photosynthesis Process</text>

  <!-- Nodes -->
  <g id="sunlight_absorption">
    <rect x="20" y="20" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="110" y="55" text-anchor="middle" dominant-baseline="middle" font-size="14">Sunlight absorption</text>
  </g>

  <g id="chlorophyll">
    <rect x="240" y="20" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="330" y="55" text-anchor="middle" dominant-baseline="middle" font-size="14">Chlorophyll (pigment)</text>
  </g>

  <g id="water_splitting">
    <rect x="20" y="120" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="110" y="155" text-anchor="middle" dominant-baseline="middle" font-size="14">Water splitting (photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="240" y="120" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="330" y="155" text-anchor="middle" dominant-baseline="middle" font-size="14">Oxygen release</text>
  </g>

  <g id="atp_nadph_production">
    <rect x="20" y="240" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="110" y="275" text-anchor="middle" dominant-baseline="middle" font-size="14">ATP &amp; NADPH production</text>
  </g>

  <g id="light_dependent_reactions">
    <rect x="240" y="240" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="330" y="275" text-anchor="middle" dominant-baseline="middle" font-size="14">Light‑dependent reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="20" y="360" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="110" y="395" text-anchor="middle" dominant-baseline="middle" font-size="14">Calvin Cycle (light‑independent)</text>
  </g>

  <g id="carbon_fixation">
    <rect x="240" y="360" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="330" y="395" text-anchor="middle" dominant-baseline="middle" font-size="14">CO₂ fixation</text>
  </g>

  <g id="glucose_production">
    <rect x="20" y="480" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="110" y="515" text-anchor="middle" dominant-baseline="middle" font-size="14">Glucose synthesis</text>
  </g>

  <g id="starch_storage">
    <rect x="240" y="480" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="330" y="515" text-anchor="middle" dominant-baseline="middle" font-size="14">Starch storage</text>
  </g>

  <!-- Edges -->
  <!-- sunlight_absorption -> chlorophyll -->
  <path d="M200,55 L240,55" stroke="black" fill="none" marker-end="url(#arrowhead)"/>
  <text x="220" y="45" font-size="12" text-anchor="middle">absorbs</text>

  <!-- chlorophyll -> light_dependent_reactions -->
  <path d="M330,90 L330,240" stroke="black" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="165" font-size="12" text-anchor="start">drives