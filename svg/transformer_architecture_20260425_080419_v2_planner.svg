<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#000">Transformer Architecture</text>

  <!-- Nodes -->
  <g id="input_embedding">
    <rect x="100" y="100" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="190" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Input Embedding</text>
  </g>

  <g id="positional_encoding">
    <rect x="320" y="100" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="410" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Positional Encoding</text>
  </g>

  <g id="encoder_self_attention">
    <rect x="540" y="100" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="630" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Multi‑Head Self‑Attention</text>
  </g>

  <g id="encoder_feed_forward">
    <rect x="760" y="100" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="850" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Feed‑Forward Network</text>
  </g>

  <g id="encoder_add_norm">
    <rect x="980" y="100" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="1070" y="135" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Add &amp; Norm</text>
  </g>

  <g id="encoder_output">
    <rect x="100" y="260" width="180" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="190" y="295" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" fill="#000">Encoder Output</text>
  </g>

  <!-- Edges -->
  <line x1="280" y1="135" x2="320" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="135" x2="540" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="135" x2="760" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="940" y1="135" x2="980" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1070" y1="170" x2="190" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>