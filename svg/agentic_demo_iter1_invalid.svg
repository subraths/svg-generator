<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Neural Network Architecture</text>

  <!-- Nodes -->
  <g id="input_layer">
    <rect x="20" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="110" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Input Layer</text>
  </g>

  <g id="convolutional_layer">
    <rect x="220" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="310" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Convolutional Layer</text>
  </g>

  <g id="batch_norm_layer">
    <rect x="220" y="390" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="310" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Batch Norm</text>
  </g>

  <g id="activation_layer">
    <rect x="220" y="480" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="310" y="515" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Activation (ReLU)</text>
  </g>

  <g id="pooling_layer">
    <rect x="420" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="510" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Pooling Layer</text>
  </g>

  <g id="flatten_layer">
    <rect x="620" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="710" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Flatten Layer</text>
  </g>

  <g id="dense_layer">
    <rect x="820" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="910" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Dense Layer</text>
  </g>

  <g id="dropout_layer">
    <rect x="820" y="390" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="910" y="425" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Dropout</text>
  </g>

  <g id="output_layer">
    <rect x="1020" y="300" width="180" height="70" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="1110" y="335" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16">Output Layer</text>
  </g>

  <!-- Edges -->
  <!-- input -> convolutional -->
  <path d="M200,335 L220,335" stroke="#000" stroke-width="2" fill="none" marker-end="url