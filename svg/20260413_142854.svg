<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- Client block -->
  <g id="client_block">
    <rect x="100" y="250" width="150" height="100" fill="#e0f7fa" stroke="#000" stroke-width="2"/>
    <text x="175" y="310" text-anchor="middle" font-size="18" fill="#000">Client</text>
  </g>

  <!-- Server block -->
  <g id="server_block">
    <rect x="750" y="250" width="150" height="100" fill="#ffe0b2" stroke="#000" stroke-width="2"/>
    <text x="825" y="310" text-anchor="middle" font-size="18" fill="#000">Server</text>
  </g>

  <!-- SYN message -->
  <g id="syn_message">
    <line x1="250" y1="300" x2="750" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="285" text-anchor="middle" font-size="18" fill="#000">SYN</text>
  </g>

  <!-- SYN-ACK message -->
  <g id="synack_message">
    <line x1="750" y1="350" x2="250" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="365" text-anchor="middle" font-size="18" fill="#000">SYN‑ACK</text>
  </g>

  <!-- ACK message -->
  <g id="ack_message">
    <line x1="250" y1="400" x2="750" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="500" y="385" text-anchor="middle" font-size="18" fill="#000">ACK</text>
  </g>

  <!-- Flow arrows (optional decorative) -->
  <g id="flow_arrows">
    <!-- Dotted line to indicate sequence order -->
    <line x1="250" y1="300" x2="250" y2="400" stroke="none" stroke-width="0"/>
  </g>
</svg>