<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="bold">Photosynthesis</text>

  <!-- Nodes -->
  <g id="sunlight">
    <rect x="90" y="205" width="180" height="70" fill="#e0f7fa" stroke="black"/>
    <text x="180" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Sunlight</text>
  </g>

  <g id="chlorophyll">
    <rect x="310" y="205" width="180" height="70" fill="#e8f5e9" stroke="black"/>
    <text x="400" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Chlorophyll (light absorber)</text>
  </g>

  <g id="light_dependent">
    <rect x="530" y="205" width="180" height="70" fill="#fff3e0" stroke="black"/>
    <text x="620" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Light‑dependent Reactions</text>
  </g>

  <g id="water_splitting">
    <rect x="750" y="205" width="180" height="70" fill="#f3e5f5" stroke="black"/>
    <text x="840" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">Water Splitting (Photolysis)</text>
  </g>

  <g id="oxygen_release">
    <rect x="970" y="205" width="180" height="70" fill="#ffebee" stroke="black"/>
    <text x="1060" y="245" text-anchor="middle" dominant-baseline="middle" font-size="14">O₂ Release</text>
  </g>

  <g id="atp_nadph">
    <rect x="750" y="325" width="180" height="70" fill="#e1f5fe" stroke="black"/>
    <text x="840" y="365" text-anchor="middle" dominant-baseline="middle" font-size="14">ATP &amp; NADPH Production</text>
  </g>

  <g id="co2_fixation">
    <rect x="310" y="445" width="180" height="70" fill="#f1f8e9" stroke="black"/>
    <text x="400" y="485" text-anchor="middle" dominant-baseline="middle" font-size="14">CO₂ Fixation</text>
  </g>

  <g id="calvin_cycle">
    <rect x="530" y="445" width="180" height="70" fill="#fffde7" stroke="black"/>
    <text x="620" y="485" text-anchor="middle" dominant-baseline="middle" font-size="14">Calvin Cycle (Light‑independent)</text>
  </g>

  <g id="glucose_production">
    <rect x="750" y="565" width="180" height="70" fill="#e8eaf6" stroke="black"/>
    <text x="840" y="605" text-anchor="middle" dominant-baseline="middle" font-size="14">Glucose Production</text>
  </g>

  <!-- Edges -->
  <!-- Sunlight → Chlorophyll -->
  <line x1="270" y1="240" x2="310" y2="240" stroke="black" marker-end="url(#arrow)"/>
  <text x="290" y="230" font-size="12" text-anchor="middle">light</text>

  <!-- Chlorophyll → Light‑dependent -->
  <line x1="490" y1="240" x2="530" y2="240" stroke="black" marker-end="url(#arrow)"/>
  <text x="510" y="230" font-size="12" text-anchor="middle">absorbs</text>

  <!-- Light‑dependent → Water Splitting -->
  <line x1="710" y1="240" x2="750" y2="