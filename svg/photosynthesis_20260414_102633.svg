<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .block { stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; }
    </style>
  </defs>

  <!-- Sunlight -->
  <g id="sunlight">
    <rect class="block" x="100" y="100" width="180" height="80" fill="#e0f7fa" rx="10"/>
    <text class="label" x="190" y="140" text-anchor="middle" dominant-baseline="middle">Sunlight</text>
  </g>

  <!-- Water -->
  <g id="water">
    <rect class="block" x="100" y="250" width="180" height="80" fill="#e0f7fa" rx="10"/>
    <text class="label" x="190" y="290" text-anchor="middle" dominant-baseline="middle">Water (H₂O)</text>
  </g>

  <!-- Carbon Dioxide -->
  <g id="carbon_dioxide">
    <rect class="block" x="100" y="400" width="180" height="80" fill="#e0f7fa" rx="10"/>
    <text class="label" x="190" y="440" text-anchor="middle" dominant-baseline="middle">Carbon Dioxide (CO₂)</text>
  </g>

  <!-- Chloroplast -->
  <g id="chloroplast">
    <rect class="block" x="400" y="225" width="250" height="150" fill="#fff9c4" rx="12"/>
    <text class="label" x="525" y="260" text-anchor="middle" dominant-baseline="middle">Chloroplast</text>
    <text class="label" x="525" y="295" text-anchor="middle" dominant-baseline="middle">(Thylakoid Membranes)</text>
  </g>

  <!-- Glucose -->
  <g id="glucose">
    <rect class="block" x="800" y="180" width="180" height="80" fill="#c8e6c9" rx="10"/>
    <text class="label" x="890" y="220" text-anchor="middle" dominant-baseline="middle">Glucose (C₆H₁₂O₆)</text>
  </g>

  <!-- Oxygen -->
  <g id="oxygen">
    <rect class="block" x="800" y="340" width="180" height="80" fill="#ffccbc" rx="10"/>
    <text class="label" x="890" y="380" text-anchor="middle" dominant-baseline="middle">Oxygen (O₂)</text>
  </g>

  <!-- Connectors -->
  <g id="connectors">
    <!-- Sunlight to Chloroplast -->
    <line x1="280" y1="140" x2="400" y2="260" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Water to Chloroplast -->
    <line x1="280" y1="290" x2="400" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- CO2 to Chloroplast -->
    <line x1="280" y1="440" x2="400" y2="340" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Chloroplast to Glucose -->
    <line x1="650" y1="300" x2="800" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
    <!-- Chloroplast to Oxygen -->
    <line x1="650" y1="300" x2="800" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
</svg>