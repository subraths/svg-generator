<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#000"/>
    </marker>
    <style>
      .block { fill:#e0e0e0; stroke:#000; stroke-width:2; }
      .label { font-family:sans-serif; font-size:18px; fill:#000; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- Input Embedding -->
  <g id="input_embedding">
    <rect class="block" x="50" y="100" width="200" height="80"/>
    <text class="label" x="150" y="140">Input Embedding</text>
  </g>

  <!-- Positional Encoding -->
  <g id="positional_encoding">
    <rect class="block" x="300" y="100" width="200" height="80"/>
    <text class="label" x="400" y="140">Positional Encoding</text>
  </g>

  <!-- Encoder Self-Attention -->
  <g id="encoder_self_attention">
    <rect class="block" x="550" y="100" width="200" height="80"/>
    <text class="label" x="650" y="140">Encoder Self‑Attention</text>
  </g>

  <!-- Encoder Feed Forward -->
  <g id="encoder_feed_forward">
    <rect class="block" x="550" y="220" width="200" height="80"/>
    <text class="label" x="650" y="260">Encoder Feed‑Forward</text>
  </g>

  <!-- Decoder Self-Attention -->
  <g id="decoder_self_attention">
    <rect class="block" x="550" y="380" width="200" height="80"/>
    <text class="label" x="650" y="420">Decoder Self‑Attention</text>
  </g>

  <!-- Decoder Encoder Attention -->
  <g id="decoder_enc_attention">
    <rect class="block" x="550" y="500" width="200" height="80"/>
    <text class="label" x="650" y="540">Decoder‑Encoder Attention</text>
  </g>

  <!-- Decoder Feed Forward -->
  <g id="decoder_feed_forward">
    <rect class="block" x="550" y="620" width="200" height="80"/>
    <text class="label" x="650" y="660">Decoder Feed‑Forward</text>
  </g>

  <!-- Output Projection -->
  <g id="output_projection">
    <rect class="block" x="300" y="720" width="200" height="80"/>
    <text class="label" x="400" y="760">Output Projection</text>
  </g>

  <!-- Arrows -->
  <!-- Input Embedding -> Positional Encoding -->
  <line x1="250" y1="140" x2="300" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Positional Encoding -> Encoder Self-Attention -->
  <line x1="500" y1="140" x2="550" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Encoder Self-Attention -> Encoder Feed Forward (vertical) -->
  <line x1="650" y1="180" x2="650" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Encoder Feed Forward -> Decoder Self-Attention (vertical) -->
  <line x1="650" y1="300" x2="650" y2="380" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder Self-Attention -> Decoder Encoder Attention (vertical) -->
  <line x1="650" y1="460" x2="650" y2="500" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder Encoder Attention -> Decoder Feed Forward (vertical) -->
  <line x1="650" y1="580" x2="650" y2="620" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decoder Feed Forward -> Output Projection -->
  <line x1="750" y1="660" x2="300" y2="760" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Encoder Feed Forward -> Decoder Encoder Attention (skip connection) -->
  <line x1="750" y1="260" x2="550" y2="540" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>