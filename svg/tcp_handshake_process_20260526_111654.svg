<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold">TCP Handshake Process</text>

  <!-- Nodes -->
  <g id="client_send_syn">
    <rect x="390" y="165" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="480" y="200" text-anchor="middle" dominant-baseline="middle" font-size="14">Client: Send SYN</text>
  </g>

  <g id="server_recv_syn">
    <rect x="830" y="265" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="920" y="300" text-anchor="middle" dominant-baseline="middle" font-size="14">Server: Receive SYN</text>
  </g>

  <g id="server_send_synack">
    <rect x="830" y="365" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="920" y="400" text-anchor="middle" dominant-baseline="middle" font-size="14">Server: Send SYN-ACK</text>
  </g>

  <g id="client_recv_synack">
    <rect x="390" y="465" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="480" y="500" text-anchor="middle" dominant-baseline="middle" font-size="14">Client: Receive SYN-ACK</text>
  </g>

  <g id="client_send_ack">
    <rect x="390" y="565" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="480" y="600" text-anchor="middle" dominant-baseline="middle" font-size="14">Client: Send ACK</text>
  </g>

  <g id="server_recv_ack">
    <rect x="830" y="665" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="920" y="700" text-anchor="middle" dominant-baseline="middle" font-size="14">Server: Receive ACK</text>
  </g>

  <g id="connection_established">
    <rect x="610" y="765" width="180" height="70" fill="#e0f7fa" stroke="#000"/>
    <text x="700" y="800" text-anchor="middle" dominant-baseline="middle" font-size="14">Connection Established</text>
  </g>

  <!-- Edges -->
  <path d="M570,200 L830,300" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="250" text-anchor="middle" font-size="12">SYN</text>

  <path d="M920,335 L920,365" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="940" y="350" text-anchor="start" font-size="12">process SYN</text>

  <path d="M830,400 L570,500" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="450" text-anchor="middle" font-size="12">SYN-ACK</text>

  <path d="M480,535 L480,565" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="550" text-anchor="start" font-size="12">process SYN-ACK</text>

  <path d="M570,600 L830,700" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="650" text-anchor="middle" font-size="12">ACK</text>

  <path d="M920,735 L700,765" stroke="#000" fill="none" marker-end="url(#arrow)"/>
  <text x="810" y="755" text-anchor="middle" font-size="12">establish</text>
</svg>