<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="black"/>
    </marker>
  </defs>

  <!-- User Application -->
  <g id="user_application">
    <rect x="15" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="75" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">User Application</text>
  </g>

  <!-- Recursive Resolver -->
  <g id="recursive_resolver">
    <rect x="185" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="245" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Recursive Resolver</text>
  </g>

  <!-- Root DNS Server -->
  <g id="root_server">
    <rect x="355" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="415" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Root DNS Server</text>
  </g>

  <!-- TLD DNS Server -->
  <g id="tld_server">
    <rect x="525" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="585" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">TLD DNS Server</text>
  </g>

  <!-- Authoritative DNS Server -->
  <g id="authoritative_server">
    <rect x="695" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="755" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Authoritative DNS Server</text>
  </g>

  <!-- IP Address -->
  <g id="ip_address">
    <rect x="865" y="310" width="120" height="80" fill="#cce5ff" stroke="#000" stroke-width="2"/>
    <text x="925" y="350" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">IP Address</text>
  </g>

  <!-- Connectors -->
  <line x1="135" y1="350" x2="185" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="305" y1="350" x2="355" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="350" x2="525" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="350" x2="695" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="815" y1="350" x2="865" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>