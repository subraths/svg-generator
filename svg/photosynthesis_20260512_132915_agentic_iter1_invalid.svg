<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="36" fill="black">Photosynthesis</text>

  <!-- Nodes -->
  <g id="light_absorption">
    <rect x="200" y="335" width="180" height="70" fill="white" stroke="black"/>
    <text x="290" y="370" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light Absorption</text>
  </g>

  <g id="water_uptake">
    <rect x="420" y="335" width="180" height="70" fill="white" stroke="black"/>
    <text x="510" y="370" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Water Uptake</text>
  </g>

  <g id="carbon_fixation">
    <rect x="640" y="335" width="180" height="70" fill="white" stroke="black"/>
    <text x="730" y="370" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Carbon Dioxide Fixation</text>
  </g>

  <g id="thylakoid_reactions">
    <rect x="200" y="435" width="180" height="70" fill="white" stroke="black"/>
    <text x="290" y="470" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Light‑Dependent Reactions</text>
  </g>

  <g id="calvin_cycle">
    <rect x="420" y="435" width="180" height="70" fill="white" stroke="black"/>
    <text x="510" y="470" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Calvin Cycle (Light‑Independent)</text>
  </g>

  <g id="glucose_production">
    <rect x="640" y="435" width="180" height="70" fill="white" stroke="black"/>
    <text x="730" y="470" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Glucose Production</text>
  </g>

  <g id="oxygen_release">
    <rect x="860" y="435" width="180" height="70" fill="white" stroke="black"/>
    <text x="950" y="470" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14">Oxygen Release</text>
  </g>

  <!-- Edges -->
  <!-- light_absorption -> thylakoid_reactions -->
  <path d="M290,405 L290,435" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="420" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">excites electrons</text>

  <!-- water_uptake -> thylakoid_reactions -->
  <path d="M510,405 L290,435" stroke="black" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="420" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="12">splits, releases O₂</text>

  <!-- thylakoid_reactions -> calvin_cycle -->
  <path d="M380,470 L420,470" stroke="black" fill="none" marker-end="url(#arrow)"/>