<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Sunlight -->
  <g id="sunlight">
    <rect x="50" y="80" width="150" height="60" fill="#FFEB3B" stroke="#B8860B" stroke-width="2"/>
    <text x="125" y="120" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Sunlight</text>
  </g>

  <!-- Water -->
  <g id="water">
    <rect x="50" y="230" width="150" height="60" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
    <text x="125" y="270" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Water (H₂O)</text>
  </g>

  <!-- Carbon Dioxide -->
  <g id="carbon_dioxide">
    <rect x="50" y="380" width="150" height="60" fill="#C8E6C9" stroke="#388E3C" stroke-width="2"/>
    <text x="125" y="420" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">CO₂</text>
  </g>

  <!-- Chloroplast -->
  <g id="chloroplast">
    <rect x="400" y="210" width="200" height="120" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2"/>
    <text x="500" y="260" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Chloroplast</text>
    <text x="500" y="285" font-family="sans-serif" font-size="16" text-anchor="middle" fill="black">(inside leaf)</text>
  </g>

  <!-- Glucose -->
  <g id="glucose">
    <rect x="750" y="130" width="150" height="60" fill="#FFCCBC" stroke="#E64A19" stroke-width="2"/>
    <text x="825" y="170" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Glucose (C₆H₁₂O₆)</text>
  </g>

  <!-- Oxygen -->
  <g id="oxygen">
    <rect x="750" y="330" width="150" height="60" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
    <text x="825" y="370" font-family="sans-serif" font-size="18" text-anchor="middle" fill="black">Oxygen (O₂)</text>
  </g>

  <!-- Arrows from inputs to chloroplast -->
  <line x1="200" y1="110" x2="400" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="260" x2="400" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="200" y1="410" x2="400" y2="310" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrows from chloroplast to outputs -->
  <line x1="600" y1="250" x2="750" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="300" x2="750" y2="360" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>