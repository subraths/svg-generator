<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead_marker" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Client box -->
  <g id="client_box">
    <rect x="200" y="150" width="200" height="100" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="300" y="210" font-family="sans-serif" font-size="18" text-anchor="middle">Client</text>
  </g>

  <!-- Server box -->
  <g id="server_box">
    <rect x="800" y="150" width="200" height="100" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="900" y="210" font-family="sans-serif" font-size="18" text-anchor="middle">Server</text>
  </g>

  <!-- SYN arrow -->
  <g id="syn_arrow">
    <line x1="400" y1="200" x2="800" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
    <text x="600" y="180" font-family="sans-serif" font-size="18" text-anchor="middle">SYN (Seq = x)</text>
  </g>

  <!-- SYN-ACK arrow -->
  <g id="syn_ack_arrow">
    <line x1="800" y1="200" x2="400" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
    <text x="600" y="220" font-family="sans-serif" font-size="18" text-anchor="middle">SYN‑ACK (Seq = y, Ack = x+1)</text>
  </g>

  <!-- ACK arrow -->
  <g id="ack_arrow">
    <line x1="400" y1="200" x2="800" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead_marker)"/>
    <text x="600" y="260" font-family="sans-serif" font-size="18" text-anchor="middle">ACK (Ack = y+1)</text>
  </g>

  <!-- Connection established label -->
  <g id="connection_state">
    <text x="600" y="320" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#006400">Connection Established</text>
  </g>

  <!-- Optional: Sequence number explanation -->
  <g id="sequence_numbers">
    <text x="600" y="380" font-family="sans-serif" font-size="16" text-anchor="middle">
      The three messages synchronize sequence numbers and confirm readiness.
    </text>
  </g>
</svg>