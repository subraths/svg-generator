<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#000">Mitochondrial Structure and Function</text>

  <!-- Nodes -->
  <g id="outer_membrane">
    <rect x="20" y="20" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="55" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Outer Membrane</text>
  </g>

  <g id="intermembrane_space">
    <rect x="20" y="120" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="155" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Intermembrane Space</text>
  </g>

  <g id="inner_membrane">
    <rect x="20" y="220" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="255" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Inner Membrane</text>
  </g>

  <g id="cristae">
    <rect x="20" y="320" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="355" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Cristae</text>
  </g>

  <g id="matrix">
    <rect x="20" y="420" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="455" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Matrix</text>
  </g>

  <g id="mt_dna">
    <rect x="20" y="520" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="110" y="555" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">mtDNA</text>
  </g>

  <g id="electron_transport_chain">
    <rect x="240" y="220" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="330" y="255" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">Electron Transport Chain</text>
  </g>

  <g id="atp_synthase">
    <rect x="240" y="320" width="180" height="70" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
    <text x="330" y="355" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">ATP Synthase</text>
  </g>

  <!-- Edges -->
  <!-- outer_membrane -> intermembrane_space -->
  <line x1="110" y1="90" x2="110" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="105" text-anchor="middle" font-size="12" fill="#000">contains</text>

  <!-- intermembrane_space -> inner_membrane -->
  <line x1="110" y1="190" x2="110" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="205" text-anchor="middle" font-size="12" fill="#000">encloses</text>

  <!-- inner_membrane -> cristae -->
  <line x1="110" y1="290" x2="110" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="305" text-anchor="middle" font-size="12" fill="#000">folds into</text>

  <!-- cristae -> matrix -->
  <line x1="110" y1="390" x2="110" y2="420" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="405" text-anchor="middle" font-size="12" fill="#000">increases SA for</text>

  <!-- matrix -> mt_dna -->
  <line x1="110" y1="490" x2="110" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="110" y="505" text-anchor="middle" font-size="12" fill="#000">contains</text>

  <!-- inner_membrane -> electron_transport_chain -->
  <line x1="200" y1="255" x2="240" y2="255" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="245" text-anchor="middle" font-size="12" fill="#000">hosts</text>

  <!-- electron_transport_chain -> atp_synthase -->
  <line x1="330" y1="290" x2="330" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="330" y="305" text-anchor="middle" font-size="12" fill="#000">drives</text>
</svg>