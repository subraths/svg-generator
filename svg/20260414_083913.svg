<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="black"/>
    </marker>
    <style>
      .box { fill:#f0f0f0; stroke:#000; stroke-width:2; }
      .arrow { stroke:#000; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
      .label { font-family:sans-serif; font-size:16px; fill:#000; }
    </style>
  </defs>

  <!-- Client -->
  <g id="client">
    <rect class="box" x="100" y="100" width="200" height="80" rx="8"/>
    <text class="label" x="200" y="150" text-anchor="middle">Client</text>
  </g>

  <!-- Server -->
  <g id="server">
    <rect class="box" x="700" y="100" width="200" height="80" rx="8"/>
    <text class="label" x="800" y="150" text-anchor="middle">Server</text>
  </g>

  <!-- SYN Arrow -->
  <g id="syn_arrow">
    <line class="arrow" x1="300" y1="140" x2="700" y2="140"/>
    <text class="label" x="500" y="130" text-anchor="middle">SYN (Seq = x)</text>
  </g>

  <!-- SYN‑ACK Arrow -->
  <g id="synack_arrow">
    <line class="arrow" x1="700" y1="200" x2="300" y2="200"/>
    <text class="label" x="500" y="210" text-anchor="middle">SYN‑ACK (Seq = y, Ack = x+1)</text>
  </g>

  <!-- ACK Arrow -->
  <g id="ack_arrow">
    <line class="arrow" x1="300" y1="260" x2="700" y2="260"/>
    <text class="label" x="500" y="250" text-anchor="middle">ACK (Ack = y+1)</text>
  </g>

  <!-- State Diagram -->
  <g id="states">
    <!-- Client states -->
    <rect class="box" x="150" y="200" width="120" height="30" rx="4"/>
    <text class="label" x="210" y="222" text-anchor="middle">CLOSED</text>
    <line class="arrow" x1="210" y1="230" x2="210" y2="250" marker-end="url(#arrowhead)"/>
    <rect class="box" x="150" y="250" width="120" height="30" rx="4"/>
    <text class="label" x="210" y="272" text-anchor="middle">SYN_SENT</text>
    <line class="arrow" x1="210" y1="280" x2="210" y2="300" marker-end="url(#arrowhead)"/>
    <rect class="box" x="150" y="300" width="120" height="30" rx="4"/>
    <text class="label" x="210" y="322" text-anchor="middle">ESTABLISHED</text>

    <!-- Server states -->
    <rect class="box" x="750" y="200" width="120" height="30" rx="4"/>
    <text class="label" x="810" y="222" text-anchor="middle">LISTEN</text>
    <line class="arrow" x1="810" y1="230" x2="810" y2="250" marker-end="url(#arrowhead)"/>
    <rect class="box" x="750" y="250" width="120" height="30" rx="4"/>
    <text class="label" x="810" y="272" text-anchor="middle">SYN_RECEIVED</text>
    <line class="arrow" x1="810" y1="280" x2="810" y2="300" marker-end="url(#arrowhead)"/>
    <rect class="box" x="750" y="300" width="120" height="30" rx="4"/>
    <text class="label" x="810" y="322" text-anchor="middle">ESTABLISHED</text>
  </g>
</svg>