<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <style>
      .node { fill:#e0f7fa; stroke:#006064; stroke-width:2; }
      .edge { stroke:#424242; stroke-width:2; fill:none; }
      .label { font-family:sans-serif; font-size:12px; fill:#212121; }
      .title { font-family:sans-serif; font-size:24px; font-weight:bold; fill:#212121; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title">Water Cycle</text>

  <!-- Nodes -->
  <g id="evaporation">
    <rect class="node" x="450" y="135" width="180" height="70" rx="8"/>
    <text class="label" x="540" y="170" text-anchor="middle" dominant-baseline="middle">Evaporation</text>
  </g>

  <g id="transpiration">
    <rect class="node" x="450" y="295" width="180" height="70" rx="8"/>
    <text class="label" x="540" y="330" text-anchor="middle" dominant-baseline="middle">Transpiration</text>
  </g>

  <g id="condensation">
    <rect class="node" x="890" y="335" width="180" height="70" rx="8"/>
    <text class="label" x="980" y="370" text-anchor="middle" dominant-baseline="middle">Condensation</text>
  </g>

  <g id="precipitation">
    <rect class="node" x="890" y="595" width="180" height="70" rx="8"/>
    <text class="label" x="980" y="630" text-anchor="middle" dominant-baseline="middle">Precipitation</text>
  </g>

  <g id="collection">
    <rect class="node" x="450" y="595" width="180" height="70" rx="8"/>
    <text class="label" x="540" y="630" text-anchor="middle" dominant-baseline="middle">Collection</text>
  </g>

  <g id="runoff">
    <rect class="node" x="130" y="595" width="180" height="70" rx="8"/>
    <text class="label" x="220" y="630" text-anchor="middle" dominant-baseline="middle">Runoff</text>
  </g>

  <g id="infiltration">
    <rect class="node" x="130" y="415" width="180" height="70" rx="8"/>
    <text class="label" x="220" y="450" text-anchor="middle" dominant-baseline="middle">Infiltration</text>
  </g>

  <g id="groundwater">
    <rect class="node" x="130" y="135" width="180" height="70" rx="8"/>
    <text class="label" x="220" y="170" text-anchor="middle" dominant-baseline="middle">Groundwater Flow</text>
  </g>

  <g id="sublimation">
    <rect class="node" x="130" y="295" width="180" height="70" rx="8"/>
    <text class="label" x="220" y="330" text-anchor="middle" dominant-baseline="middle">Sublimation</text>
  </g>

  <!-- Edges -->
  <g class="edge" marker-end="url(#arrow)">
    <line x1="630" y1="170" x2="890" y2="370"/>
    <text class="label" x="760" y="270" text-anchor="middle" dominant-baseline="middle">water vapor rises</text>
  </g>

  <g class="edge" marker-end="url(#arrow)">
    <line x1="540" y1="295" x2="540" y2="205"/>
    <text class="label" x="540" y="250" text-anchor="middle" dominant-baseline="middle">adds moisture</text>
  </g>

  <g class="edge" marker-end="url(#arrow)">
    <line x1="980" y1="405" x2="980" y2="595"/>
    <text class="label" x="980" y="500" text-anchor="middle" dominant-bas